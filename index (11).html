function printClubRequests(sel){
  const list=(sel&&sel.length)?sel:reqFiltered();
  if(!list.length)return toast('لا توجد طلبات مطابقة للطباعة','dan');
  const byClub={};
  list.forEach(r=>{(byClub[r.clubId]=byClub[r.clubId]||[]).push(r)});
  const keys=Object.keys(byClub);
  const secs=keys.map(cid=>{
    const rs=byClub[cid];
    const rows=rs.map((r,i)=>`<tr><td>${i+1}</td><td>${h(r.no)}</td><td>${h(kindName(r.kind))}</td>
      <td style="text-align:right">${r.lines.map(l=>h(l.name)+' ('+l.qty+' '+h(l.unit)+')').join(' ، ')}</td>
      <td>${r.lines.length}</td><td>${fmtD(r.dates.created)}</td><td>${h(ST[r.status])}</td>
      <td>${h(r.approvedBy||'—')}</td><td>${h(r.rejectReason||r.supplier||'—')}</td></tr>`).join('');
    return `<div class="clubhead"><span>${h(clubName(cid))}</span><span>عدد الطلبات: ${rs.length}</span></div>
      <table><thead><tr><th>م</th><th>رقم الطلب</th><th>النوع</th><th>الأصناف</th><th>عدد الأصناف</th>
      <th>التاريخ</th><th>الحالة</th><th>المعتمد</th><th>ملاحظات</th></tr></thead><tbody>${rows}</tbody></table>`;
  }).join('');
  printPage(`<div class="pv">
    ${docHead('كشف طلبات النوادي','CLUB REQUESTS REPORT','',null)}
    ${metaRow([['عدد النوادي',keys.length],['إجمالي الطلبات',list.length],
      ['الفترة',(F.from?fmtD(F.from):'من البداية')+' — '+(F.to?fmtD(F.to):'حتى اليوم'),1],['أُعد بواسطة',ses.fullName]])}
    ${secs}
    <div class="sign"><div>أمين المخزن<br>&nbsp;</div><div>مشرف النوادي<br>&nbsp;</div><div>مدير المخزن<br>&nbsp;</div></div>
    <div class="ftr"><span>${h(S.settings.orgName)}</span><span>طُبع في ${fmtDT(nowISO())}</span></div></div>`,'كشف طلبات النوادي');
}
/* ================= العهد ================= */
function custRemain(c){return c.qty-(c.retQty||0)-(c.dmgDone||0)}
function custPill(c){
  if(c.dmgPending>0)return `<span class="pill p-dan">عالقة — تالف/ضائع ${c.dmgPending} بانتظار القرار</span>`;
  if(c.rejectNote)return `<span class="pill p-dan">مرتجعة للنادي — بانتظار ذكر السبب</span>`;
  if(c.status==='returned')return '<span class="pill p-ok">مسترجعة بالكامل</span>';
  if(c.status==='damaged')return '<span class="pill p-dan">تم إتلاف العهدة</span>';
  if(c.status==='short')return '<span class="pill p-warn">مسترجعة بنواقص</span>';
  if(c.returnReq)return '<span class="pill p-info">طلب إرجاع مقدَّم</span>';
  return '<span class="pill p-warn">قائمة</span>';
}
function pgCustody(){
  const tab=F.ctab||'open';
  const all=scopedCust().filter(c=>{
    if(F.club&&c.clubId!==F.club)return false;
    if(F.q){const s2=(c.no+' '+c.assetName+' '+c.assetCode+' '+clubName(c.clubId)).toLowerCase();
      if(!s2.includes(F.q.toLowerCase()))return false}
    return true;
  });
  const open=all.filter(c=>c.status==='open'&&!(c.dmgPending>0)&&!c.rejectNote);
  const stuck=all.filter(c=>c.dmgPending>0||c.rejectNote);
  const back=all.filter(c=>['returned','short','damaged'].includes(c.status));
  const list=tab==='open'?open:tab==='back'?back:tab==='stuck'?stuck:all;
  const tabBtn=(k,t,n,cls)=>`<button class="btn ${F.ctab===k||(!F.ctab&&k==='open')?'gold':'ghost'} sm"
    onclick="F.ctab='${k}';renderPage()">${t} <span class="pill ${cls||'p-gray'}">${n}</span></button>`;
  const kitBox=(ses.role==='club'&&kitOut(ses.clubId).length)?`
    <div class="card" style="margin-bottom:14px;border-color:#F0C9C5"><div class="card-h" style="background:#FDF2F1">
      <h3>${h(kitDef().name)}</h3><span class="pill p-dan">في عهدة ناديكم</span>
      <button class="btn dan sm" style="margin-inline-start:auto" onclick="kitReturnModal()">إرجاع الحقيبة الثابتة</button></div>
    <div class="card-b" style="padding-top:10px"><div style="display:flex;gap:8px;flex-wrap:wrap">
      ${kitOut(ses.clubId).map(c=>`<span class="pill p-gray">${h(c.assetName)} — المتبقي ${custRemain(c)}</span>`).join('')}
    </div></div></div>`:'';
  const body=tab==='club'?clubGroups(all):custTable(list);
  return `${kitBox}<div class="toolbar">
    <input class="grow" type="text" placeholder="بحث برقم السند أو الأصل" value="${h(F.q)}" oninput="F.q=this.value;renderPage()">
    ${ses.role!=='club'?`<select onchange="setF('club',this.value)"><option value="">كل النوادي</option>
      ${S.clubs.map(c=>`<option value="${c.id}" ${F.club===c.id?'selected':''}>${h(c.name)}</option>`).join('')}</select>`:''}
    <button class="btn ghost" onclick="printTable('tblCu','سجل العهد')">&#128424; طباعة</button>
    <button class="btn ghost" onclick="exportTable('tblCu','سجل_العهد')">&#128202; Excel</button></div>
  <div class="toolbar" style="margin-top:-4px">
    ${tabBtn('open','العهد القائمة',open.length,'p-warn')}
    ${tabBtn('back','المسترجعة والمغلقة',back.length,'p-ok')}
    ${tabBtn('stuck','العالقة',stuck.length,'p-dan')}
    ${tabBtn('club','حسب النادي',S.clubs.filter(c=>all.some(x=>x.clubId===c.id)).length,'p-info')}</div>
  <div class="card"><div class="tw" style="max-height:62vh">${body}</div></div>`;
}
function custTable(list,idAttr){
  const late=c=>c.status==='open'&&c.dueAt&&c.dueAt<today();
  const rows=list.map(c=>{
    const red=c.dmgPending>0||c.rejectNote||c.status==='damaged'||c.status==='short'||late(c);
    return `<tr class="${red?'red':''}"><td class="mono">${h(c.no)}</td><td class="mono">${h(c.assetCode)}</td>
    <td>${h(c.assetName)}${c.kit?'<div style="font-size:11.5px;color:var(--ink3)">ضمن حقيبة النادي</div>':''}</td>
    <td>${h(clubName(c.clubId))}</td><td class="mono">${c.qty}</td><td class="mono">${c.retQty||0}</td>
    <td class="mono ${c.dmgPending||c.dmgDone?'red-txt':''}">${(c.dmgPending||0)+(c.dmgDone||0)}</td>
    <td class="mono">${custRemain(c)}</td>
    <td>${fmtD(c.dueAt)} ${late(c)?'<span class="pill p-dan">متأخرة</span>':''}</td>
    <td>${custPill(c)}${c.rejectNote?`<div style="font-size:11.5px" class="red-txt">${h(c.rejectNote)}</div>`:''}</td>
    <td style="display:flex;gap:6px;flex-wrap:wrap">
      ${ses.role==='club'&&c.status==='open'&&!c.returnReq&&!c.rejectNote&&custRemain(c)>0?`<button class="btn ghost sm" onclick="askReturn('${c.id}')">طلب إرجاع</button>`:''}
      ${ses.role==='club'&&c.rejectNote?`<button class="btn dan sm" onclick="clubReasonModal('${c.id}')">ذكر السبب</button>`:''}
      ${can('manager','keeper')&&c.returnReq?`<button class="btn gold sm" onclick="returnModal('${c.id}')">استلام الإرجاع</button>`:''}
      ${can('manager','keeper')&&c.dmgPending>0?`<button class="btn dan sm" onclick="damageModal('${c.id}')">قرار التالف</button>`:''}
      <button class="btn ghost sm" onclick="viewVoucher('${c.voucherId}')">سند الخروج</button>
      ${c.retVoucher?`<button class="btn ghost sm" onclick="viewVoucher('${c.retVoucher}')">سند الإرجاع</button>`:''}
      ${c.dmgVoucher?`<button class="btn ghost sm" onclick="viewVoucher('${c.dmgVoucher}')">سند الإتلاف</button>`:''}
    </td></tr>`}).join('');
  return `<table id="${idAttr||'tblCu'}"><thead><tr><th>سند الخروج</th><th>رقم الأصل</th><th>الأصل</th>
    <th>النادي</th><th>المصروفة</th><th>المرتجعة</th><th>تالف/ضائع</th><th>المتبقي</th><th>موعد الإرجاع</th>
    <th>حالة العهدة</th><th class="nos"></th></tr></thead>
    <tbody>${rows||`<tr><td colspan="11"><div class="empty"><b>لا توجد عهد في هذا التبويب</b></div></td></tr>`}</tbody></table>`;
}
function clubGroups(all){
  const ids=[...new Set(all.map(c=>c.clubId))];
  if(!ids.length)return `<div class="empty"><b>لا توجد عهد</b></div>`;
  return `<table id="tblCu"><thead><tr><th>النادي</th><th>عهد قائمة</th><th>عالقة</th><th>مسترجعة</th>
    <th>إجمالي المصروف</th><th>المتبقي على النادي</th><th class="nos"></th></tr></thead><tbody>
    ${ids.map(id=>{
      const g=all.filter(c=>c.clubId===id);
      const op=g.filter(c=>c.status==='open'&&!c.dmgPending&&!c.rejectNote).length;
      const st=g.filter(c=>c.dmgPending>0||c.rejectNote).length;
      const bk=g.filter(c=>['returned','short','damaged'].includes(c.status)).length;
      const rem=g.reduce((a,c)=>a+custRemain(c),0);
      return `<tr class="${st?'red':''}"><td>${h(clubName(id))}</td><td class="mono">${op}</td>
        <td class="mono ${st?'red-txt':''}">${st}</td><td class="mono">${bk}</td>
        <td class="mono">${g.reduce((a,c)=>a+c.qty,0)}</td><td class="mono">${rem}</td>
        <td><button class="btn ghost sm" onclick="F.club='${id}';F.ctab='open';renderPage()">عرض عهد النادي</button></td></tr>`;
    }).join('')}</tbody></table>`;
}
/* --- إرجاع الحقيبة الدائمة دفعة واحدة --- */
function kitReturnModal(){
  const out=kitOut(ses.clubId);
  if(!out.length)return toast('لا توجد حقيبة في عهدة ناديكم','dan');
  modal(`<div class="modal"><div class="mh"><h3>إرجاع ${h(kitDef().name)}</h3><button onclick="closeModal()">&times;</button></div>
  <div class="mb"><div class="note">أدخل الكمية السليمة والتالفة لكل مادة. الكمية المعادة تنقص تلقائيًا بمقدار التالف.</div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th class="nos">المادة</th><th class="nos">المتبقي</th>
      <th class="nos">تالف/ضائع</th><th class="nos">المعادة سليمة</th></tr></thead>
      <tbody>${out.map(c=>{const rem=custRemain(c);return `<tr><td>${h(c.assetName)}</td><td class="mono">${rem}</td>
        <td><input type="number" min="0" max="${rem}" id="kd_${c.id}" value="0" style="width:90px"
          oninput="kitRowSync('${c.id}',${rem})"></td>
        <td><input type="number" min="0" max="${rem}" id="kq_${c.id}" value="${rem}" style="width:90px"></td></tr>`}).join('')}
      </tbody></table></div>
    <div class="field" style="margin-top:12px"><label>بيان التالف أو الضائع</label>
      <textarea id="k_note" style="min-height:120px" placeholder="إلزامي عند وجود تالف أو ضائع"></textarea></div></div>
  <div class="mf"><button class="btn gold" onclick="submitKitReturn()">إرسال طلب إرجاع الحقيبة</button>
  <button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div>`);
}
function kitRowSync(id,rem){
  const d=num(document.getElementById('kd_'+id).value);
  document.getElementById('kq_'+id).value=Math.max(0,rem-d);
}
function submitKitReturn(){
  const out=kitOut(ses.clubId),note=(document.getElementById('k_note').value||'').trim();
  let anyDmg=false,n=0;
  for(const c of out){
    const d=num(document.getElementById('kd_'+c.id).value),q=num(document.getElementById('kq_'+c.id).value);
    if(d>0)anyDmg=true;
    if(q+d>custRemain(c))return toast('كمية أكبر من المتبقي في: '+c.assetName,'dan');
  }
  if(anyDmg&&!note)return toast('اكتب بيان التالف أو الضائع','dan');
  for(const c of out){
    const d=num(document.getElementById('kd_'+c.id).value),q=num(document.getElementById('kq_'+c.id).value);
    if(q+d<=0)continue;
    c.returnReq=true;c.reqQty=q;c.reqDmg=d;c.reqNote=note;c.returnReqAt=nowISO();c.rejectNote='';n++;
  }
  if(!n)return toast('أدخل كميات الإرجاع','dan');
  notify('طلب إرجاع '+kitDef().name+' من '+clubName(ses.clubId)+(anyDmg?' — يتضمن تالف/ضائع':''),'keeper');
  notify('طلب إرجاع '+kitDef().name+' من '+clubName(ses.clubId),'manager');
  logIt('طلب إرجاع الحقيبة','عهدة',kitDef().name,'',n+' مادة',note);
  save();closeModal();renderPage();toast('أُرسل طلب إرجاع الحقيبة','ok');
}
/* --- طلب الإرجاع من النادي --- */
function askReturn(id){
  const c=S.custody.find(x=>x.id===id);const rem=custRemain(c);
  modal(`<div class="modal"><div class="mh"><h3>طلب إرجاع عهدة — ${h(c.assetName)}</h3><button onclick="closeModal()">&times;</button></div>
  <div class="mb">
    <div class="kv" style="margin-bottom:14px"><b>سند الخروج</b><span class="mono">${h(c.no)}</span>
      <b>الكمية المصروفة</b><span>${c.qty}</span><b>المتبقي عليك</b><span>${rem}</span></div>
    <div class="note">هل العهدة كاملة أم فيها تالف أو ضائع؟ حدّد الكميات بدقة قبل الإرسال.</div>
    <div class="row" style="margin-top:14px">
      <div class="field"><label>الكمية التالفة أو الضائعة</label>
        <input id="rr_d" type="number" min="0" max="${rem}" value="0" oninput="dmgSync(${rem})"></div>
      <div class="field"><label>الكمية المعادة سليمة</label>
        <input id="rr_q" type="number" min="0" max="${rem}" value="${rem}" oninput="kitSum(${rem})"></div>
    </div>
    <div class="field"><label>بيان التالف أو الضائع</label>
      <textarea id="rr_n" style="min-height:130px" placeholder="إلزامي عند وجود تالف أو ضائع"></textarea></div>
    <div id="rr_msg" class="note info">العهدة كاملة.</div>
  </div>
  <div class="mf"><button class="btn gold" onclick="submitReturnReq('${id}')">إرسال طلب الإرجاع</button>
  <button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div>`);
}
function dmgSync(rem){
  const d=num(document.getElementById('rr_d').value);
  document.getElementById('rr_q').value=Math.max(0,rem-d);
  kitSum(rem);
}
function kitSum(rem){
  const q=num(document.getElementById('rr_q').value),d=num(document.getElementById('rr_d').value);
  const m=document.getElementById('rr_msg');
  if(q+d>rem){m.className='note dan';m.textContent='مجموع الكميات ('+(q+d)+') أكبر من المتبقي عليك ('+rem+').';}
  else if(d>0){m.className='note dan';m.textContent='العهدة غير كاملة: '+d+' تالف أو ضائع، وستبقى عالقة على النادي حتى صدور قرار وسند إتلاف.';}
  else if(q<rem){m.className='note';m.textContent='إرجاع جزئي: يبقى '+(rem-q)+' على النادي.';}
  else{m.className='note info';m.textContent='العهدة كاملة.';}
}
function submitReturnReq(id){
  const c=S.custody.find(x=>x.id===id);const rem=custRemain(c);
  const q=num(document.getElementById('rr_q').value),d=num(document.getElementById('rr_d').value),
        nt=document.getElementById('rr_n').value.trim();
  if(q+d<=0)return toast('أدخل كمية للإرجاع','dan');
  if(q+d>rem)return toast('مجموع الكميات أكبر من المتبقي على النادي','dan');
  if(d>0&&!nt)return toast('اكتب بيان التالف أو الضائع','dan');
  c.returnReq=true;c.reqQty=q;c.reqDmg=d;c.reqNote=nt;c.returnReqAt=nowISO();c.rejectNote='';
  notify('طلب إرجاع عهدة '+c.assetName+' من '+clubName(c.clubId)+(d>0?' — يتضمن '+d+' تالف/ضائع':''),'keeper');
  notify('طلب إرجاع عهدة '+c.assetName+' من '+clubName(c.clubId),'manager');
  logIt('طلب إرجاع عهدة','عهدة',c.no,'',q+' سليم / '+d+' تالف',nt);
  save();closeModal();renderPage();toast('أُرسل طلب الإرجاع','ok');
}
function clubReasonModal(id){
  const c=S.custody.find(x=>x.id===id);
  modal(`<div class="modal sm"><div class="mh"><h3>توضيح السبب — ${h(c.assetName)}</h3><button onclick="closeModal()">&times;</button></div>
  <div class="mb"><div class="note dan">أُعيدت العهدة إلى ناديكم: ${h(c.rejectNote)}</div>
  <div class="field" style="margin-top:12px"><label>سبب النقص أو الملاحظة</label><textarea id="cr_n"></textarea></div></div>
  <div class="mf"><button class="btn gold" onclick="saveClubReason('${id}')">إرسال وإعادة طلب الإرجاع</button>
  <button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div>`);
}
function saveClubReason(id){

  if(!t)return toast('اكتب السبب','dan');

/* --- استلام الإرجاع من أمين المخزن أو المدير --- */

  const c=S.custody.find(x=>x.id===id);
  if(!c.returnReq)return toast('لا يوجد طلب إرجاع مقدَّم لهذه العهدة','dan');

  <div class="mb">
    <div class="kv" style="margin-bottom:12px"><b>سند الخروج</b><span class="mono">${h(c.no)}</span>
      <b>النادي</b><span>${h(clubName(c.clubId))}</span>
      <b>المتبقي على النادي</b><span>${rem}</span>
      <b>طلب النادي</b><span>${c.reqQty||0} سليم${c.reqDmg?` · <span class="red-txt">${c.reqDmg} تالف/ضائع</span>`:''}</span>
      ${c.reqNote?`<b>بيان النادي</b><span>${h(c.reqNote)}</span>`:''}</div>
    <div class="row">
      <div class="field"><label>الكمية المقبولة (تدخل المخزن)</label><input id="r_q" type="number" min="0" max="${rem}" value="${Math.max(0,rem-(c.reqDmg||0))}"></div>
      <div class="field"><label>الكمية المرتجعة للنادي</label><input id="r_rej" type="number" min="0" max="${rem}" value="0" oninput="syncRet(${rem})"></div>
      <div class="field"><label>الكمية التالفة أو الضائعة</label><input id="r_dmg" type="number" min="0" max="${rem}" value="${c.reqDmg||0}" oninput="syncRet(${rem})"></div>
      <div class="field"><label>حالة الأصل عند الإرجاع</label><select id="r_c">
        ${['سليمة','مستعملة','تحتاج صيانة','تالفة'].map(x=>`<option>${x}</option>`).join('')}</select></div>
      <div class="field"><label>تاريخ الإرجاع</label><input id="r_d" type="date" value="${today()}"></div>
      <div class="field"><label>اسم مستلم العهدة (مشرف النادي)</label><input id="r_by" value="${h(clubOfficer(c.clubId))}"></div>
      <div class="field"><label>اسم أمين المخزن</label><input id="r_kp" value="${h(keeperName())}" placeholder="إلزامي"></div>
    </div>
    <div class="field"><label>سبب إرجاع الكمية للنادي</label><input id="r_rn" placeholder="إلزامي عند إرجاع كمية للنادي"></div>
    <div class="field"><label>ملاحظات</label><input id="r_n" value="${h(c.reqNote||'')}"></div>
    <div class="note dan">الكمية التالفة أو الضائعة تبقى عالقة على النادي حتى صدور قرار وسند إتلاف عهدة.</div>
  </div>
  <div class="mf"><button class="btn gold" onclick="saveReturn('${id}')">اعتماد الإرجاع وإصدار السند</button>
  <button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div>`);
}
function syncRet(rem){
  const d=num(document.getElementById('r_dmg').value),rj=num(document.getElementById('r_rej').value);
  const q=Math.max(0,rem-d-rj);
  document.getElementById('r_q').value=q;
}
function clubOfficer(clubId){
  const u=S.users.find(x=>x.clubId===clubId&&x.role==='club'&&x.status==='approved');
  return (u?u.fullName+' — ':'')+clubName(clubId);
}
function keeperName(){
  if(ses&&(ses.role==='keeper'))return ses.fullName;
  const u=S.users.find(x=>x.role==='keeper'&&x.status==='approved');
  return u?u.fullName:(ses?ses.fullName:'');
}
function saveReturn(id){
  if(!can('manager','keeper'))return toast('هذا الإجراء من صلاحية أمين المخزن أو المدير','dan');
  const c=S.custody.find(x=>x.id===id);const rem=custRemain(c);
  const g=x=>document.getElementById(x).value;
  const q=num(g('r_q')),rej=num(g('r_rej')),dmg=num(g('r_dmg'));
  const cond=g('r_c'),d=g('r_d'),by=g('r_by').trim(),kp=g('r_kp').trim(),rn=g('r_rn').trim(),nt=g('r_n').trim();
  if(q+rej+dmg<=0)return toast('أدخل الكميات المستلمة','dan');
  if(q+rej+dmg>rem)return toast('مجموع الكميات أكبر من المتبقي على النادي ('+rem+')','dan');
  if(rej>0&&!rn)return toast('اكتب سبب إرجاع الكمية إلى النادي','dan');
  if(!by||!kp)return toast('اسم مستلم العهدة واسم أمين المخزن إلزاميان','dan');
  const a=assetById(c.assetId);
  const dISO=d?new Date(d).toISOString():nowISO();
  if(q>0){
    const before=a.qty;a.qty+=q;c.retQty=(c.retQty||0)+q;
    addMove('إرجاع عهدة','أصل ثابت',a.name,q,before,a.qty,nt,c.no,c.clubId);
  }
  c.dmgPending=(c.dmgPending||0)+dmg;
  c.cond=cond;c.retDate=dISO;c.receivedBy=by;c.keeperName=kp;c.returnReq=false;c.reqQty=0;c.reqDmg=0;
  c.rejectNote=rej>0?(rn+' (الكمية: '+rej+')'):'';
  const r=S.reqs.find(x=>x.id===c.reqId);
  if(q>0){
    const v=mkVoucher('AR',r||{id:null,no:'',clubId:c.clubId},[{name:c.assetName,code:c.assetCode,unit:a.unit,
      qty:c.qty,qty2:c.retQty,qty3:c.qty-c.retQty,cond,notes:[nt,rej>0?'مرتجع للنادي: '+rn:'',dmg>0?'تالف/ضائع: '+dmg:''].filter(Boolean).join(' — ')}],
      {receiver:by,keeper:kp,date:dISO,notes:'مرتبط بسند الخروج '+c.no,clubId:c.clubId});
    c.retVoucher=v.id;logIt('إرجاع عهدة','سند',v.no,c.qty,c.retQty,nt);
  }
  refreshCustStatus(c);
  if(dmg>0)notify('عهدة '+c.assetName+' من '+clubName(c.clubId)+' فيها '+dmg+' تالف/ضائع بانتظار القرار','manager');
  if(rej>0)notify('أُعيدت كمية من عهدة '+c.assetName+' إلى ناديكم لذكر السبب: '+rn,'club',c.clubId);
  notify('سُجّل إرجاع عهدة '+c.assetName,'club',c.clubId);
  save();closeModal();renderPage();
  toast(dmg>0?'سُجّل الإرجاع، والتالف عالق بانتظار القرار':'سُجّل الإرجاع وصدر السند','ok');
}
function refreshCustStatus(c){
  if(c.dmgPending>0){c.status='open';}
  else if(custRemain(c)<=0){ c.status=(c.dmgDone>0)?'damaged':(c.retQty>=c.qty?'returned':'short'); }
  else c.status='open';
  const r=S.reqs.find(x=>x.id===c.reqId);
  if(r){
    const open=S.custody.filter(x=>x.reqId===r.id&&(x.status==='open'||x.dmgPending>0)).length;
    if(!open&&['await_return','issued','issued_part'].includes(r.status)){
      r.status=S.custody.filter(x=>x.reqId===r.id).every(x=>x.status==='returned')?'returned':'returned_short';
      hist(r,'اكتمل إغلاق العهد المرتبطة بالطلب');
    }
  }
}

function saveDamage(id){
  if(!can('manager','keeper'))return toast('هذا الإجراء من صلاحية أمين المخزن أو المدير','dan');
  const c=S.custody.find(x=>x.id===id);
  const dec=document.getElementById('d_dec').value,q=num(document.getElementById('d_q').value),
        dt=document.getElementById('d_d').value,by=document.getElementById('d_by').value.trim(),
        rs=document.getElementById('d_n').value.trim();
  if(q<=0||q>c.dmgPending)return toast('كمية غير صحيحة','dan');
  if(!rs)return toast('سبب التلف أو الفقد إلزامي','dan');
  const a=assetById(c.assetId);
  c.dmgPending-=q;c.dmgDone=(c.dmgDone||0)+q;c.dmgReason=rs;c.dmgDecision=dec;
  const r=S.reqs.find(x=>x.id===c.reqId);
  const v=mkVoucher('DM',r||{id:null,no:'',clubId:c.clubId},
    [{name:c.assetName,code:c.assetCode,unit:a?a.unit:'حبة',qty:c.qty,qty2:q,qty3:custRemain(c),cond:'تالف/ضائع',notes:rs}],
    {receiver:by,keeper:keeperName(),date:dt?new Date(dt).toISOString():nowISO(),
     notes:'القرار: '+dec+' — مرتبط بسند الخروج '+c.no,clubId:c.clubId});
  c.dmgVoucher=v.id;
  if(c.retVoucher){
    const ar=S.vouchers.find(x=>x.id===c.retVoucher);
    if(ar){
      ar.notes=(ar.notes?ar.notes+' — ':'')+'سند إتلاف عهدة: '+v.no;
      const L=ar.lines[0];
      if(L){L.qty2=c.retQty;L.qty3=custRemain(c);
        L.notes=[L.notes,'تالف/ضائع '+q+' بسند إتلاف '+v.no].filter(Boolean).join(' — ');}
    }
  }else{
    const ar=mkVoucher('AR',r||{id:null,no:'',clubId:c.clubId},
      [{name:c.assetName,code:c.assetCode,unit:a?a.unit:'حبة',qty:c.qty,qty2:c.retQty,qty3:custRemain(c),
        cond:'تالف/ضائع',notes:'تالف/ضائع '+q+' بسند إتلاف '+v.no}],
      {receiver:clubOfficer(c.clubId),keeper:keeperName(),date:dt?new Date(dt).toISOString():nowISO(),
       notes:'مرتبط بسند الخروج '+c.no+' — سند إتلاف عهدة: '+v.no,clubId:c.clubId});
    c.retVoucher=ar.id;
  }
  S.damages.unshift({id:uid(),ts:nowISO(),assetId:c.assetId,code:c.assetCode,name:c.assetName,clubId:c.clubId,
    qty:q,reason:rs,decision:dec,voucher:v.no,by});
  addMove('إتلاف عهدة','أصل ثابت',c.assetName,-q,a?a.qty:0,a?a.qty:0,rs,v.no,c.clubId);
  logIt('قرار تالف/ضائع','سند',v.no,c.dmgPending+q,c.dmgPending,dec+' — '+rs);
  refreshCustStatus(c);
  notify('صدر سند إتلاف عهدة '+v.no+' لـ'+c.assetName+' — القرار: '+dec,'club',c.clubId);
  if(dec.indexOf('بديل')>-1)notify('على ناديكم شراء بديل جديد للأصل '+c.assetName,'club',c.clubId);
  notify('صدر سند إتلاف عهدة '+v.no,'manager');
  save();closeModal();renderPage();toast('صدر سند الإتلاف '+v.no,'ok');
}

function submitKit(){
  const st=kitStatus();
  const lines=st.filter(x=>x.avail>0&&x.assetId).map(x=>({id:uid(),refId:x.assetId,name:x.name,unit:x.unit,
    qty:Math.min(x.need,x.avail),notes:'ضمن '+kitDef().name,cls:'asset',status:'pending',done:0}));
  if(!lines.length)return toast('لا تتوفر أي مادة من مواد الحقيبة حاليًا، أنشئ طلب شراء','dan');
  const short=st.filter(x=>x.short>0).map(x=>({name:x.name,qty:x.short}));
  const r=newReq('asset',lines);
  r.kit=true;r.kitName=kitDef().name;r.kitShort=short;
  if(short.length)notify('طلب '+kitDef().name+' من '+clubName(r.clubId)+' — نواقص: '+short.map(x=>x.name+' ('+x.qty+')').join(' · '),'manager');
  save();closeModal();
  toast(short.length?'أُرسل الطلب برقم '+r.no+' مع تسجيل النقص':'أُرسل طلب الحقيبة برقم '+r.no,'ok');
  go('reqs');
}

}

  if(id){
    const u=S.users.find(x=>x.id===id);const before=u.role;

function uploadLogo(inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>400*1024)return toast('حجم الشعار كبير، اختر صورة أقل من 400 كيلوبايت','dan');
  const rd=new FileReader();
  rd.onload=()=>{S.settings.logo=rd.result;logIt('تحديث الشعار','إعدادات','','','');save();render();toast('حُدّث الشعار','ok')};
  rd.readAsDataURL(f);
}
function removeLogo(){
  S.settings.logo='';logIt('إزالة الشعار','إعدادات','','','');save();render();toast('أُزيل الشعار','ok');
}
function backup(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='نسخة-المخزن-'+today()+'.json';a.click();
  logIt('نسخة احتياطية','نظام','','','تصدير');save();
}
function restore(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{const d=JSON.parse(rd.result);
      if(!d.users||!d.items)throw 0;
      confirmBox('استيراد نسخة','ستحل النسخة المستوردة محل البيانات الحالية بالكامل.',()=>{
        S=d;save();toast('استُوردت النسخة','ok');render();
      },'dan');
    }catch(e){toast('الملف غير صالح','dan')}
  };
  rd.readAsText(f);
}
function wipe(){
  confirmBox('تصفير النظام','سيُحذف كل شيء وتعود البيانات التجريبية. صدّر نسخة أولًا.',()=>{

/* ================= تقارير وقوائم منسدلة ================= */
function ddToggle(btn){
  const d=btn.closest('.dd'),was=d.classList.contains('open');
  document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open'));
  if(!was)d.classList.add('open');
}

function pvDoc(title,head,body,meta){
  return `<div class="pv">${docHead(title,'WAREHOUSE REPORT','',null)}
    ${metaRow([['عدد السجلات',body.length],['أُعد بواسطة',ses.fullName],['التاريخ',fmtD(nowISO()),1],['ملاحظة',meta||'—']])}

    <tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${h(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>

function report(title,head,body,meta,mode){
  if(!body.length)return toast('لا توجد بيانات في هذا التقرير','dan');
  if(mode==='xls'){xlsFile(title.replace(/\s/g,'_'),title,head,body,meta||'');toast('نُزّل ملف Excel','ok')}
  else printPage(pvDoc(title,head,body,meta),title);
}
/* --- المواد الاستهلاكية --- */
function itemsRep(mode,out){
  const list=S.items.filter(i=>mode==='avail'?i.qty>0:mode==='out'?i.qty<=0:true);
  const title=mode==='avail'?'المواد الاستهلاكية المتوفرة':mode==='out'?'المواد الاستهلاكية النافدة':'جميع المواد الاستهلاكية';
  const head=['م','رقم الصنف','المادة','التصنيف','الوحدة','الرصيد','الحد الأدنى','الحالة','ملاحظات'];
  const body=list.map((i,n)=>[n+1,i.code,i.name,i.cat,i.unit,i.qty,i.min,
    i.qty<=0?'نفدت':i.qty<=i.min?'منخفضة':'متوفرة',i.notes||'—']);
  report(title,head,body,'إجمالي الكميات: '+list.reduce((a,i)=>a+i.qty,0),out);
}
/* --- الأصول الثابتة والتوالف --- */
function assetsRep(mode,out){
  if(mode==='damaged'){
    const head=['م','التاريخ','رقم الأصل','الأصل','النادي','الكمية','القرار','السبب','سند الإتلاف','المعتمد'];
    const body=S.damages.map((d,n)=>[n+1,fmtD(d.ts),d.code,d.name,clubName(d.clubId),d.qty,d.decision,d.reason,d.voucher,d.by]);
    return report('الأصول التالفة والضائعة',head,body,'إجمالي الكميات التالفة: '+S.damages.reduce((a,d)=>a+d.qty,0),out);
  }
  const head=['م','رقم الأصل','الأصل','التصنيف','داخل المخزن','خارج (عهدة)','الحالة','الموقع','الباركود','قيمة الأصل'];
  const body=S.assets.map((a,n)=>{
    const o=S.custody.filter(c=>c.assetId===a.id&&c.status==='open').reduce((t,c)=>t+custRemain(c),0);
    return [n+1,a.code,a.name,a.cat,a.qty,o,a.cond,a.shelf,a.barcode,a.value||0];
  });
  report('كشف الأصول الثابتة',head,body,'عدد الأصناف: '+S.assets.length,out);
}

    'تاريخ الخروج','الموعد المتوقع','تاريخ الإرجاع','مستلم العهدة','أمين المخزن','الحالة'];

    c.receivedBy||'—',c.keeperName||'—',

      :c.status==='short'?'مسترجعة بنواقص':'قائمة']);
  report(title,head,body,'عدد السجلات: '+sel.length,out);
}
/* ================= التقارير الإدارية ================= */
function inRange(iso){
  if(!iso)return false;
  const d=String(iso).slice(0,10);
  if(F.from&&d<F.from)return false;
  if(F.to&&d>F.to)return false;
  return true;
}
function repData(){
  const reqs=S.reqs.filter(r=>inRange(r.dates.created));
  const vous=S.vouchers.filter(v=>inRange(v.date));
  const cust=S.custody.filter(c=>inRange(c.issuedAt));
  const dmg=S.damages.filter(d=>inRange(d.ts));
  return {reqs,vous,cust,dmg};
}
function clubSummary(){
  const {reqs,vous,cust,dmg}=repData();
  return S.clubs.map(c=>{
    const rs=reqs.filter(r=>r.clubId===c.id);
    const co=vous.filter(v=>v.type==='CO'&&v.clubId===c.id);
    const cu=cust.filter(x=>x.clubId===c.id);
    const last=rs[0]?rs[0].dates.created:null;
    return {name:c.name,id:c.id,total:rs.length,
      approved:rs.filter(r=>!['rejected','review','classify','new'].includes(r.status)).length,
      rejected:rs.filter(r=>r.status==='rejected').length,
      issuedItems:co.reduce((a,v)=>a+v.lines.reduce((t,l)=>t+num(l.qty),0),0),
      custody:cu.length,open:S.custody.filter(x=>x.clubId===c.id&&x.status==='open').length,
      damaged:dmg.filter(d=>d.clubId===c.id).reduce((a,d)=>a+d.qty,0),
      last};
  });
}
function topItems(){
  const {vous}=repData();
  const m={};
  vous.filter(v=>v.type==='CO').forEach(v=>v.lines.forEach(l=>{
    m[l.name]=m[l.name]||{name:l.name,qty:0,times:0,unit:l.unit||''};
    m[l.name].qty+=num(l.qty);m[l.name].times++;
  }));
  return Object.values(m).sort((a,b)=>b.qty-a.qty);
}
function supplierCost(){
  const {reqs}=repData();
  const m={};
  reqs.filter(r=>r.kind==='purchase').forEach(r=>{
    const sup=r.supplier||'غير محدد';
    m[sup]=m[sup]||{sup,reqs:0,items:0,cost:0};
    m[sup].reqs++;
    r.lines.forEach(l=>{if(l.bought>0){m[sup].items+=l.bought;m[sup].cost+=num(l.bought)*num(l.price)}});
  });
  return Object.values(m).sort((a,b)=>b.cost-a.cost);
}

function repPrint(kind,out){
  const period=(F.from?fmtD(F.from):'من البداية')+' — '+(F.to?fmtD(F.to):'حتى اليوم');
  if(kind==='clubs'){
    const head=['النادي','الطلبات','المعتمدة','المرفوضة','كميات استهلاكية مصروفة','عهد صادرة','عهد قائمة','تالف/ضائع','آخر طلب'];
    const body=clubSummary().map(c=>[c.name,c.total,c.approved,c.rejected,c.issuedItems,c.custody,c.open,c.damaged,fmtD(c.last)]);
    return report('تقرير أداء النوادي',head,body,'الفترة: '+period,out);
  }
  if(kind==='items'){
    const head=['المادة','الوحدة','إجمالي الكمية المصروفة','عدد مرات الصرف'];
    const body=topItems().map(x=>[x.name,x.unit,x.qty,x.times]);
    return report('تقرير أكثر المواد صرفًا',head,body,'الفترة: '+period,out);
  }
  const head=['المورد','عدد الطلبات','الأصناف المشتراة','التكلفة'];
  const body=supplierCost().map(x=>[x.sup,x.reqs,x.items,x.cost]);
  report('تقرير تكاليف الشراء حسب المورد',head,body,'الفترة: '+period,out);
}

function auditRows(type){

    cat:i.cat,unit:i.unit,sys:i.qty,actual:i.qty,note:''}));
  if(type!=='consumable')S.assets.forEach(a=>{
    const outC=S.custody.filter(c=>c.assetId===a.id&&c.status==='open').reduce((t,c)=>t+custRemain(c),0);

  return out;
}

function readAudit(a){
  a.lines.forEach((l,i)=>{
    const e=document.getElementById('ac_'+i);
    if(e)l.actual=num(e.value);
    const n=document.getElementById('an_'+i);
    if(n)l.note=n.value.trim();

function saveAudit(id,approve){
  const a=S.audits.find(x=>x.id===id);
  readAudit(a);
  const diffs=a.lines.filter(l=>l.actual-l.sys!==0);
  if(!approve){save();closeModal();renderPage();return toast('حُفظت المسودة','ok')}
  const missing=diffs.filter(l=>!l.note);
  if(missing.length)return toast('اكتب سبب الفرق للأصناف: '+missing.slice(0,3).map(l=>l.name).join(' ، ')+(missing.length>3?' ...':''),'dan');
  confirmBox('اعتماد الجرد',`سيُطبّق ${diffs.length} تسوية على الأرصدة ولا يمكن التراجع عنها.`,()=>{
    diffs.forEach(l=>{
      const t=l.kind==='asset'?assetById(l.refId):itemById(l.refId);
      if(!t)return;
      const before=t.qty;t.qty=l.actual;
      addMove('تسوية جرد',l.kind==='asset'?'أصل ثابت':'مادة استهلاكية',t.name,l.actual-before,before,t.qty,
        l.note,a.no,null);
      logIt('تسوية جرد','جرد',a.no,before,t.qty,l.note);
    });
    a.status='approved';a.approvedAt=nowISO();a.approvedBy=ses.fullName;
    notify('اعتُمد محضر الجرد '+a.no+' بعدد '+diffs.length+' تسوية','manager');
    runAlerts();save();closeModal();renderPage();toast('اعتُمد الجرد وطُبّقت التسويات','ok');
  },'ok');
}

    <td class="mono">${h(d.voucher)}</td><td>${h(d.by)}</td></tr>`).join('');
  const stuck=S.custody.filter(c=>c.dmgPending>0);
  return `${stuck.length?`<div class="note dan" style="margin-bottom:14px">${stuck.length} عهدة عالقة بتالف أو ضائع بانتظار القرار.
    <a onclick="go('custody')" style="cursor:pointer;font-weight:700">فتح صفحة العهد</a></div>`:''}
  <div class="toolbar">
    <button class="btn ghost" onclick="assetsRep('damaged','print')">&#128424; طباعة التالف</button>
    <button class="btn ghost" onclick="assetsRep('damaged','xls')">&#128202; تنزيل Excel</button>
    <button class="btn ghost" onclick="custodyRep('damaged','print')">&#128424; طباعة العهد العالقة والتالفة</button></div>
  <div class="card"><div class="tw"><table id="tblDm"><thead><tr><th>م</th><th>التاريخ</th><th>رقم الأصل</th><th>الأصل</th>
    <th>النادي</th><th>الكمية</th><th>القرار</th><th>السبب</th><th>سند الإتلاف</th><th>المعتمد</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="10"><div class="empty"><b>لا توجد أصول تالفة</b>تُسجَّل هنا بعد اعتماد قرار التالف أو الضائع.</div></td></tr>`}</tbody></table></div></div>`;
}

function sendMsg(){
  const cid=document.getElementById('m_club').value,t=document.getElementById('m_txt').value.trim();
  if(!t)return toast('اكتب نص الرسالة','dan');
  S.msgs.unshift({id:uid(),ts:nowISO(),clubId:cid||null,text:t,by:ses.fullName});
  if(cid)notify('رسالة من الإدارة: '+t,'club',cid);
  else S.clubs.forEach(c=>notify('رسالة من الإدارة: '+t,'club',c.id));
  logIt('إرسال رسالة','رسالة',cid?clubName(cid):'جميع النوادي','',t.slice(0,60));
  save();renderPage();toast('أُرسلت الرسالة','ok');
}
/* ================= أدوات مشتركة ================= */
function filterTable(inp,tid){
  const q=inp.value.toLowerCase(),t=document.getElementById(tid);
  if(!t)return;
  [...t.tBodies[0].rows].forEach(r=>{const s2=String(r.innerText||r.textContent||'').toLowerCase();r.style.display=s2.includes(q)?'':'none'});
}
function tableData(tid){
  const t=document.getElementById(tid); if(!t)return null;
  const rows=[...t.rows].filter(r=>r.style.display!=='none');
  if(!rows.length)return null;
  const tx=c=>String(c.innerText||c.textContent||'');
  const head=[...rows[0].cells].map(c=>tx(c).trim());
  const body=rows.slice(1).map(r=>[...r.cells].map(c=>tx(c).replace(/\s+/g,' ').trim()));
  return {head,body:body.filter(r=>r.join('').trim()!=='')};
}
function xlsFile(name,sheetTitle,head,body,meta){
  const th=head.map(x=>`<th>${h(x)}</th>`).join('');
  const tr=body.map((r,i)=>`<tr>${r.map((c,j)=>`<td ${j===0?'class="c"':''}>${h(c)}</td>`).join('')}</tr>`).join('');
  const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8">
  <style>
    table{border-collapse:collapse;font-family:Tajawal,Arial;font-size:12px}
    th{background:#0B3B6B;color:#fff;border:1px solid #08294f;padding:7px 9px;font-weight:bold;text-align:center;white-space:nowrap}
    td{border:1px solid #9DB2C6;padding:6px 9px;text-align:center;mso-number-format:"\\@"}
    td.c{background:#F2F6FA;font-weight:bold}
    tr:nth-child(even) td{background:#F7FAFC}
    .ttl{font-size:15px;font-weight:bold;color:#0B3B6B}
    .sub{font-size:11px;color:#8A1538}
  </style></head><body dir="rtl">
  <table><tr><td colspan="${head.length}" class="ttl" style="border:none;text-align:right">${h(S.settings.orgName)} — ${h(sheetTitle)}</td></tr>
  <tr><td colspan="${head.length}" class="sub" style="border:none;text-align:right">${h(meta||'')} · أُعد في ${fmtDT(nowISO())} بواسطة ${h(ses?ses.fullName:'')}</td></tr></table>
  <table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></body></html>`;
  const blob=new Blob(['\uFEFF'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+today()+'.xls';
  document.body.appendChild(a);a.click();a.remove();
}
function exportTable(tid,name){
  const d=tableData(tid); if(!d)return toast('لا توجد بيانات للتصدير','dan');
  xlsFile(name,name.replace(/_/g,' '),d.head,d.body,'');
  toast('نُزّل ملف Excel','ok');
}
function printTable(tid,title){
  const d=tableData(tid); if(!d)return toast('لا توجد بيانات للطباعة','dan');
  printPage(`<div class="pv">${docHead(title,'WAREHOUSE REPORT','',null)}
    ${metaRow([['عدد السجلات',d.body.length],['أُعد بواسطة',ses.fullName],['التاريخ',fmtD(nowISO()),1]])}
    <table><thead><tr>${d.head.map(x=>`<th>${h(x)}</th>`).join('')}</tr></thead>
    <tbody>${d.body.map(r=>`<tr>${r.map(c=>`<td>${h(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <div class="ftr"><span>${h(S.settings.orgName)} — ${h(S.settings.warehouse)}</span><span>${fmtDT(nowISO())}</span></div></div>`,title);
}
function exportVoucherXls(id){
  const v=S.vouchers.find(x=>x.id===id);
  const head=['م','رقم الصنف','الصنف','الوحدة','الكمية','الكمية 2','الكمية 3','الحالة','ملاحظات'];
  const body=v.lines.map((l,i)=>[i+1,l.code||'—',l.name,l.unit||'—',l.qty,l.qty2==null?'—':l.qty2,
    l.qty3==null?'—':l.qty3,l.cond||'—',l.notes||'—']);
  xlsFile(vTypeName(v.type)+'-'+v.no,vTypeName(v.type)+' '+v.no,head,body,
    clubName(v.clubId)+' · طلب '+(v.reqNo||'—')+' · '+fmtD(v.date));
  toast('نُزّل ملف Excel','ok');
}
function exportClubRequestsXls(){
  const list=reqFiltered();
  if(!list.length)return toast('لا توجد طلبات مطابقة','dan');
  const byClub={};list.forEach(r=>{(byClub[r.clubId]=byClub[r.clubId]||[]).push(r)});
  const head=['النادي','رقم الطلب','نوع الطلب','الأصناف','عدد الأصناف','تاريخ الطلب','الحالة','المعتمد','المورد','ملاحظات'];
  const body=[];
  Object.keys(byClub).forEach(cid=>{
    byClub[cid].forEach(r=>body.push([clubName(cid),r.no,kindName(r.kind),
      r.lines.map(l=>l.name+' ('+l.qty+' '+l.unit+')').join(' ، '),r.lines.length,
      fmtD(r.dates.created),ST[r.status],r.approvedBy||'—',r.supplier||'—',r.rejectReason||'—']));
  });
  xlsFile('طلبات_النوادي','كشف طلبات النوادي',head,body,'عدد النوادي: '+Object.keys(byClub).length);
  toast('نُزّل ملف Excel مرتب حسب النادي','ok');
}
document.addEventListener('click',e=>{
  const th=e.target.closest('th'); if(!th||th.classList.contains('nos'))return;
  const tb=th.closest('table');if(!tb||!tb.tBodies[0])return;
  const i=[...th.parentNode.children].indexOf(th);
  const dir=th.dataset.dir==='asc'?-1:1;
  [...th.parentNode.children].forEach(x=>delete x.dataset.dir);th.dataset.dir=dir===1?'asc':'desc';
  const rows=[...tb.tBodies[0].rows];
  if(rows.length<2)return;
  rows.sort((a,b)=>{
    const cx=a.cells[i],cy=b.cells[i];const x=String((cx&&(cx.innerText||cx.textContent))||''),y=String((cy&&(cy.innerText||cy.textContent))||'');
    const nx=parseFloat(x.replace(/[^\d.-]/g,'')),ny=parseFloat(y.replace(/[^\d.-]/g,''));
    if(!isNaN(nx)&&!isNaN(ny)&&x.trim()!==''&&y.trim()!=='')return (nx-ny)*dir;
    return x.localeCompare(y,'ar')*dir;
  });
  rows.forEach(r=>tb.tBodies[0].appendChild(r));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
