<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة مخزن النوادي الثقافية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --line:#E3E5E9; --line2:#EFF0F3;
  --ink:#1E2126; --ink2:#5B626C; --ink3:#8A919B;
  --side:#23262B; --side2:#2C3036; --side-ink:#C9CDD3;
  --gold:#B8912F; --gold-l:#F3EAD3; --gold-d:#8A6C1F;
  --ok:#256B4E; --ok-l:#E4F1EA;
  --warn:#9A6B0C; --warn-l:#FBF0DA;
  --dan:#A82820; --dan-l:#FAE7E5;
  --info:#2A5C8A; --info-l:#E5EDF5;
  --r:10px; --shadow:0 1px 2px rgba(20,25,35,.06),0 6px 18px rgba(20,25,35,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--info);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C8CCD2;border-radius:6px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ===== Login ===== */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-art{background:var(--side);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art:after{content:"";position:absolute;inset:auto -80px -120px auto;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(184,145,47,.35),transparent 62%)}
.auth-art h1{font-size:33px;font-weight:800;margin:0 0 10px;letter-spacing:-.4px}
.auth-art p{color:#A9AEB6;max-width:44ch;margin:0}
.auth-flow{display:flex;flex-direction:column;gap:14px;margin-top:34px;position:relative;z-index:1}
.auth-flow div{display:flex;align-items:center;gap:12px;color:#D6D9DE}
.auth-flow span{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#33373D;color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:12.5px}
.auth-brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--gold)}
.auth-panel{display:grid;place-items:center;padding:32px}
.auth-card{width:min(420px,100%)}
.auth-card h2{margin:0 0 4px;font-size:23px}
.auth-card .sub{color:var(--ink2);margin:0 0 22px}
.tabs-auth{display:flex;gap:6px;background:#EDEEF1;padding:4px;border-radius:10px;margin-bottom:18px}
.tabs-auth button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink2)}
.tabs-auth button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}


/* ===== شاشة الدخول ===== */
html,body{overflow-x:hidden;max-width:100%}
.lgw{min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:22px 16px;position:relative;overflow:hidden;
  background:#0B1B2E;
  background-image:radial-gradient(1100px 620px at 78% -12%,rgba(27,95,166,.55),transparent 60%),
    radial-gradient(760px 520px at 6% 106%,rgba(138,21,56,.34),transparent 62%),
    linear-gradient(168deg,#0B1B2E 0%,#0B3B6B 58%,#09263F 100%)}
.lgw:before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:52px 52px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 72%)}
.lgcard{position:relative;width:100%;max-width:430px;background:rgba(255,255,255,.98);border-radius:20px;
  box-shadow:0 26px 64px rgba(3,14,28,.44),0 2px 0 rgba(255,255,255,.6) inset;padding:26px 24px 22px;
  border:1px solid rgba(255,255,255,.5)}
.lgbrand{text-align:center;margin-bottom:18px}
.lglogo{width:62px;height:62px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(145deg,#0B3B6B,#1B5FA6);box-shadow:0 10px 22px rgba(11,59,107,.34)}
.lglogo svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lgbrand h1{font-size:19px;margin:0 0 4px;font-weight:800;color:#0B2540;letter-spacing:-.2px;line-height:1.45}
.lgbrand p{margin:0;color:#6B7683;font-size:12.5px}
.lgtabs{display:flex;gap:4px;background:#EEF1F5;padding:4px;border-radius:12px;margin-bottom:18px}
.lgtabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;cursor:pointer;
  font-weight:700;color:#5B6A78;font-size:13.5px;transition:background .15s,color .15s}
.lgtabs button.on{background:#fff;color:#0B3B6B;box-shadow:0 2px 8px rgba(11,37,64,.12)}
.lgtabs button.reg{color:#0B7A3B}
.lgtabs button.reg.on{background:#0F9D58;color:#fff;box-shadow:0 0 0 3px rgba(57,255,20,.45),0 2px 10px rgba(15,157,88,.35)}
.regbox{background:#F1FCF4;border:2px solid #39FF14;border-radius:14px;padding:14px;
  box-shadow:0 0 0 4px rgba(57,255,20,.16),0 0 18px rgba(57,255,20,.28)}
.regbox .lgbtn{background:linear-gradient(135deg,#0B7A3B,#0F9D58);box-shadow:0 10px 22px rgba(15,157,88,.32)}
.regbox .lghint{background:#E7F8ED;border-color:#B9E9C9;color:#14532D}
.lgf{margin-bottom:13px}
.lgf label{display:block;font-size:12.5px;font-weight:700;color:#41505F;margin-bottom:6px}
.lgin{position:relative;display:flex;align-items:center}
.lgw .lgin input[type]{width:100%;padding:13px 48px 13px 46px;border:1.5px solid #DBE1E8;border-radius:12px;
  background:#F9FAFC;font-size:15px;text-align:right;direction:rtl}
.lgw .lgin input[type]::placeholder{text-align:right}
.lgw .lgin input[type]:focus{background:#fff;border-color:#1B5FA6;box-shadow:0 0 0 4px rgba(27,95,166,.13);outline:none}
.lgw .lgin .ic{position:absolute;right:14px;z-index:2;top:50%;transform:translateY(-50%);color:#94A2B1;font-size:16px;
  line-height:1;pointer-events:none;width:20px;text-align:center}
.lgw .lgin .eye{position:absolute;left:8px;z-index:2;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;
  color:#5B6A78;padding:6px 8px;border-radius:8px;font-size:15px;line-height:1}
.lgw .lgin .eye:hover{background:#EEF1F5}
.lgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 18px;flex-wrap:wrap}
.lgrow label{display:flex;align-items:center;gap:7px;font-size:13px;color:#41505F;cursor:pointer}
.lgrow a{font-size:13px;color:#1B5FA6;font-weight:700;cursor:pointer}
.lgbtn{width:100%;border:0;border-radius:12px;padding:14px;font-size:15.5px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#0B3B6B,#1B5FA6);box-shadow:0 10px 22px rgba(11,59,107,.32)}
.lgbtn:hover{filter:brightness(1.07)}
.lgbtn:active{transform:translateY(1px)}
.lghint{margin-top:16px;background:#F2F6FA;border:1px solid #DCE6F0;border-radius:11px;padding:10px 13px;
  font-size:12.5px;color:#3C5570;line-height:1.8}
@media(max-width:420px){
  .lgcard{padding:20px 16px 18px;border-radius:16px}
  .lgbrand h1{font-size:17px}.lglogo{width:54px;height:54px}
  .lgw .lgin input[type]{padding:12px 44px 12px 42px;font-size:15px}
}
@media(max-height:640px){.lgw{justify-content:flex-start}}

.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;top:calc(100% + 4px);inset-inline-start:0;background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:0 12px 32px rgba(20,25,35,.16);min-width:236px;z-index:70;display:none;overflow:hidden}
.dd.open .dd-menu{display:block}
.dd-menu button{display:block;width:100%;text-align:right;padding:10px 13px;border:0;background:none;cursor:pointer;font-size:13.5px}
.dd-menu button:hover{background:#F5F6F8}
.dd-menu .sep{border-top:1px solid var(--line2);margin:4px 0}
.dd-menu .lbl{padding:7px 13px 3px;font-size:11.5px;font-weight:700;color:var(--ink3)}
tr.red td{background:#FDF2F1}
.red-txt{color:var(--dan);font-weight:700}
.logo-box{width:38px;height:38px;border-radius:10px;object-fit:cover;background:#fff}

/* ===== Shell ===== */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-head{padding:18px 18px 14px;border-bottom:1px solid #33373E}
.side-head b{color:#fff;display:block;font-size:15.5px}
.side-head small{color:#8D939B}
.nav{flex:1;overflow:auto;padding:10px 10px 20px}
.nav-group{margin-top:14px;padding:0 8px 6px;color:#767C85;font-size:11.5px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);cursor:pointer;font-weight:500;position:relative}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--side2);color:#fff}
.nav a.on:before{content:"";position:absolute;right:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.nav .badge{margin-inline-start:auto;background:var(--gold);color:#231C08;border-radius:20px;padding:0 7px;font-size:11.5px;font-weight:700}
.nav .badge.big{font-size:14.5px;font-weight:800;padding:1px 11px;min-width:30px;text-align:center;
  background:var(--dan);color:#fff;box-shadow:0 0 0 3px rgba(168,40,32,.18)}
.side-foot{padding:12px;border-top:1px solid #33373E}
.btn-out{width:100%;background:#3A2220;color:#FF9E95;border:1px solid #5A2E29;padding:9px;border-radius:9px;cursor:pointer;font-weight:700}
.btn-out:hover{background:var(--dan);color:#fff;border-color:var(--dan)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
.top h1{margin:0;font-size:18px;font-weight:700}
.top .who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--gold-l);color:var(--gold-d);display:grid;place-items:center;font-weight:800}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.page{padding:22px;max-width:1400px;width:100%}

/* ===== Blocks ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15.5px}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.stat span{color:var(--ink2);font-size:13px}
.stat.g b{color:var(--gold-d)} .stat.ok b{color:var(--ok)} .stat.dan b{color:var(--dan)} .stat.warn b{color:var(--warn)} .stat.info b{color:var(--info)}
.sec-title{font-size:13px;font-weight:700;color:var(--ink2);margin:22px 0 10px}

/* ===== Forms ===== */
.field{margin-bottom:13px}
.field label{display:block;font-weight:600;margin-bottom:5px;font-size:13.5px}
.field .hint{color:var(--ink3);font-size:12.5px;margin-top:4px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid #D9DCE1;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(184,145,47,.13)}
textarea{min-height:92px;resize:vertical}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.btn{background:var(--side);color:#fff;border:1px solid var(--side);padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#000}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#231C08}
.btn.gold:hover{background:var(--gold-d);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border-color:#D9DCE1}
.btn.ghost:hover{background:#F6F7F9}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.dan{background:var(--dan);border-color:var(--dan)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:160px}
.toolbar input,.toolbar select{padding:8px 10px}

/* ===== Table ===== */
.tw{overflow:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
th{background:#F7F8FA;text-align:right;padding:10px 12px;font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;cursor:pointer}
th.nos{cursor:default}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:#FBFBFC}
.empty{padding:44px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.p-gray{background:#EDEEF1;color:#4B525B} .p-ok{background:var(--ok-l);color:var(--ok)}
.p-warn{background:var(--warn-l);color:var(--warn)} .p-dan{background:var(--dan-l);color:var(--dan)}
.p-info{background:var(--info-l);color:var(--info)} .p-gold{background:var(--gold-l);color:var(--gold-d)}
.mono{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.2px}

/* ===== Rail (request timeline) ===== */
.rail{display:flex;gap:0;flex-wrap:wrap;margin:2px 0 6px}
.rail div{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 0;color:var(--ink3);font-size:12.5px}
.rail div i{width:20px;height:20px;border-radius:50%;border:2px solid #DDE0E4;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;background:#fff}
.rail div.done{color:var(--ok)} .rail div.done i{border-color:var(--ok);background:var(--ok);color:#fff}
.rail div.now{color:var(--gold-d);font-weight:700} .rail div.now i{border-color:var(--gold);color:var(--gold-d)}

/* ===== Modal / toast ===== */
.ov{position:fixed;inset:0;background:rgba(22,25,30,.5);display:grid;place-items:center;padding:18px;z-index:90;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.sm{width:min(460px,100%)}
.modal.lg{width:min(1000px,100%)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.mh h3{margin:0;font-size:16px}
.mh button{margin-inline-start:auto;background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink2);line-height:1}
.mb{padding:18px;overflow:auto}
.mf{padding:13px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-start;background:#FAFBFC;border-radius:0 0 14px 14px}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--side);color:#fff;padding:11px 16px;border-radius:10px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .22s ease}
.toast.ok{background:var(--ok)} .toast.dan{background:var(--dan)}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.note{background:var(--gold-l);border:1px solid #E6D6A9;color:#6C5313;padding:10px 13px;border-radius:9px;font-size:13.5px}
.note.dan{background:var(--dan-l);border-color:#F0C9C5;color:#8A1F19}
.note.info{background:var(--info-l);border-color:#CFE0EE;color:#1F4468}
.chk{width:17px;height:17px;accent-color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv b{color:var(--ink2);font-weight:600}

/* ===== Print ===== */
.doc{font-size:13px;color:#000;background:#fff}
.doc h2{text-align:center;margin:0 0 2px;font-size:19px}
.doc .docsub{text-align:center;color:#444;margin-bottom:14px;font-size:12.5px}
.doc .hdr{display:flex;justify-content:space-between;border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
.doc table{font-size:12.5px;border:1px solid #999}
.doc th,.doc td{border:1px solid #BBB;padding:6px 8px}
.doc th{background:#F1EEE4;position:static;color:#000}
.sign{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.sign div{flex:1;min-width:150px;border-top:1px dashed #999;padding-top:6px;text-align:center;color:#333;font-size:12.5px}
@media print{
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{position:absolute;inset:0;padding:14mm;width:100%}
  @page{size:A4;margin:10mm}
}
@media(max-width:900px){
  .auth-wrap{grid-template-columns:1fr}.auth-art{display:none}
  .side{position:fixed;z-index:80;transform:translateX(100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
  .burger{display:block}
  .page{padding:14px}
  .top{padding:10px 14px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="printArea" style="display:none"></div>
<script>
/* ================= الحالة والتخزين ================= */
const KEY='wh_clubs_v1';
const ROLES={club:'مستخدم نادي',keeper:'أمين المخزن',supervisor:'مشرف النوادي',manager:'مدير المخزن',admin:'مدير النظام'};
const ST={
  draft:'مسودة', new:'طلب جديد', review:'بانتظار مراجعة مدير المخزن', classify:'بانتظار التصنيف',
  approved:'معتمد', rejected:'مرفوض', keeper:'محال إلى أمين المخزن', buying:'بانتظار الشراء',
  bought:'تم الشراء بالكامل', bought_part:'تم الشراء جزئيًا', not_bought:'لم يتم الشراء',
  received:'تم التوريد إلى المخزن', ready:'جاهز للصرف', issued_part:'تم الصرف جزئيًا',
  issued:'تم الصرف بالكامل', await_return:'بانتظار إرجاع العهدة', returned:'تمت إعادة العهدة بالكامل',
  returned_short:'تمت إعادة العهدة بنواقص', closed:'مغلق'
};
const STCLR={draft:'p-gray',new:'p-info',review:'p-warn',classify:'p-warn',approved:'p-ok',rejected:'p-dan',
  keeper:'p-info',buying:'p-warn',bought:'p-ok',bought_part:'p-warn',not_bought:'p-dan',received:'p-ok',
  ready:'p-gold',issued_part:'p-warn',issued:'p-ok',await_return:'p-warn',returned:'p-ok',returned_short:'p-warn',closed:'p-gray'};

let S=null, ses=null, route='dash', sideOpen=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtD(d){if(!d)return '—';const x=new Date(d);if(isNaN(x))return '—';const p=n=>String(n).padStart(2,'0');return p(x.getDate())+'-'+p(x.getMonth()+1)+'-'+x.getFullYear()}
function fmtDT(d){if(!d)return '—';const x=new Date(d);const p=n=>String(n).padStart(2,'0');return fmtD(d)+' '+p(x.getHours())+':'+p(x.getMinutes())}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n}
function yr(){return new Date().getFullYear()}
function nextNo(pfx){
  S.seq[pfx]=S.seq[pfx]||{};
  const y=yr(); S.seq[pfx][y]=(S.seq[pfx][y]||0)+1;
  return pfx+'-'+y+'-'+String(S.seq[pfx][y]).padStart(4,'0');
}

function save(){

}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}

function logIt(action,type,ref,before,after,reason){
  S.log.unshift({id:uid(),ts:nowISO(),user:ses?ses.fullName:'—',role:ses?ses.role:'—',
    action,type:type||'',ref:ref||'',before:before||'',after:after||'',reason:reason||''});
  if(S.log.length>4000)S.log.length=4000;
}
function notify(text,to,clubId){
  S.notes.unshift({id:uid(),ts:nowISO(),text,to:to||'all',clubId:clubId||null,read:[]});
  if(S.notes.length>600)S.notes.length=600;
}
function runAlerts(){
  const t=today();let n=0;
  S.custody.forEach(c=>{
    if(c.status!=='open'||!c.dueAt)return;
    const days=Math.ceil((new Date(c.dueAt)-new Date(t))/86400000);
    if(days<0&&!c.alertLate){
      c.alertLate=true;n++;
      notify('تأخرت عهدة '+c.assetName+' عن موعد الإرجاع ('+fmtD(c.dueAt)+')','club',c.clubId);
      notify('عهدة متأخرة: '+c.assetName+' لدى '+clubName(c.clubId),'keeper');
      notify('عهدة متأخرة: '+c.assetName+' لدى '+clubName(c.clubId),'manager');
    }else if(days>=0&&days<=3&&!c.alertSoon){
      c.alertSoon=true;n++;
      notify('يقترب موعد إرجاع عهدة '+c.assetName+' بتاريخ '+fmtD(c.dueAt),'club',c.clubId);
    }
  });
  S.items.forEach(i=>{
    if(i.qty<=i.min&&!i.alertLow){
      i.alertLow=true;n++;
      notify('انخفضت كمية «'+i.name+'» إلى '+i.qty+' وهي عند الحد الأدنى أو أقل','keeper');
      notify('انخفضت كمية «'+i.name+'» إلى '+i.qty,'manager');
    }else if(i.qty>i.min&&i.alertLow){i.alertLow=false}
  });
  if(n)save();
}
function myNotes(){
  if(!ses)return [];
  return S.notes.filter(n=>n.to==='all'||n.to===ses.role||(n.to==='club'&&n.clubId===ses.clubId));

function unread(){return myNotes().filter(n=>!n.read.includes(ses.id)).length}

function toast(msg,kind){
  const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3200);
}
function modal(html){document.getElementById('modalRoot').innerHTML='<div class="ov" onclick="if(event.target===this)closeModal()">'+html+'</div>'}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function confirmBox(title,msg,onOk,kind){
  window.__ok=()=>{closeModal();onOk()};
  modal(`<div class="modal sm"><div class="mh"><h3>${h(title)}</h3><button onclick="closeModal()">&times;</button></div>
  <div class="mb">${msg}</div>
  <div class="mf"><button class="btn ${kind||'gold'}" onclick="window.__ok()">تأكيد</button>
  <button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div>`);
}

function clubName(id){const c=S.clubs.find(x=>x.id===id);return c?c.name:'—'}
function userName(id){const u=S.users.find(x=>x.id===id);return u?u.fullName:'—'}
function can(...roles){
  if(!ses)return false;
  if(ses.role==='admin')return true;
  if(roles.includes(ses.role))return true;
  return ses.role==='supervisor'&&roles.includes('keeper');
}
function actAs(role){
  if(!ses)return;
  if(!ses.origRole){ses.origRole=ses.role;ses.origClub=ses.clubId}
  ses.role=role;
  if(role==='club'&&!ses.clubId)ses.clubId=S.clubs[0]?S.clubs[0].id:null;
  if(role!=='club'&&ses.origRole==='admin')ses.clubId=null;
  route='dash';closeModal();render();
  toast('تعمل الآن بدور: '+ROLES[role],'ok');
}
function backToSelf(){
  if(!ses.origRole)return;
  ses.role=ses.origRole;ses.clubId=ses.origClub||null;ses.origRole=null;
  route='dash';render();toast('عدت إلى دورك الأصلي','ok');
}

function doLogin(){
  const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value;
  const usr=S.users.find(x=>x.username===u);
  const fail=(why)=>{S.logins.unshift({id:uid(),ts:nowISO(),username:u,ok:false,why});save();toast(why,'dan')};
  if(!usr)return fail('اسم المستخدم غير موجود');
  if(usr.status==='pending')return fail('الحساب بانتظار الاعتماد');
  if(usr.status==='rejected')return fail('طلب التسجيل مرفوض');
  if(usr.status==='disabled')return fail('الحساب معطّل، راجع مدير النظام');
  if(usr.pass!==p)return fail('كلمة المرور غير صحيحة');
  S.logins.unshift({id:uid(),ts:nowISO(),username:u,ok:true,why:''});
  const rem=document.getElementById('lgrem');
  try{ if(rem&&rem.checked)localStorage.setItem('wh_remember',u); else localStorage.removeItem('wh_remember'); }catch(e){}
  ses=usr; route='dash'; logIt('تسجيل دخول','مستخدم',usr.username); runAlerts(); save(); render();
}

function navCount(kind){
  if(kind==='reqs'){
    const rs=scopedReqs();
    if(ses.role==='club')return rs.filter(r=>!['closed','rejected'].includes(r.status)).length;
    return rs.filter(r=>!['closed','rejected','returned','returned_short'].includes(r.status)).length;
  }
  if(kind==='users')return S.users.filter(u=>u.status==='pending').length;
  if(kind==='custody'){
    const cu=scopedCust();
    return cu.filter(c=>c.status==='open'||c.dmgPending>0).length;
  }
  return 0;
}
function pageTitle(){
  for(const g of NAV)for(const i of g.items)if(i.k===route)return i.t;
  return 'النظام';
}

function scopedReqs(){return ses.role==='club'?S.reqs.filter(r=>r.clubId===ses.clubId):S.reqs}
function scopedCust(){return ses.role==='club'?S.custody.filter(c=>c.clubId===ses.clubId):S.custody}
function scopedVou(){return ses.role==='club'?S.vouchers.filter(v=>v.clubId===ses.clubId):S.vouchers}
function stat(n,label,cls,go2){
  return `<div class="stat ${cls||''}" ${go2?`style="cursor:pointer" onclick="go('${go2}')"`:''}><b>${n}</b><span>${h(label)}</span></div>`;
}
function pgDash(){
  const R=scopedReqs(),V=scopedVou(),Cu=scopedCust();
  const low=S.items.filter(i=>i.qty<=i.min).length;
  const cnt=f=>R.filter(f).length;
  const pend=S.users.filter(u=>u.status==='pending').length;
  const openC=Cu.filter(c=>c.status==='open').length;
  let out='';
  if(ses.role==='club')out+=windowBanner();
  if(can('manager')&&pend) out+=`<div class="note" style="margin-bottom:14px">لديك ${pend} طلب تسجيل بانتظار الاعتماد. <a onclick="go('users')" style="cursor:pointer;font-weight:700">مراجعة الطلبات</a></div>`;
  if(can('keeper','manager','admin')&&low) out+=`<div class="note dan" style="margin-bottom:14px">${low} مادة وصلت الحد الأدنى أو أقل. <a onclick="go('cons')" style="cursor:pointer;font-weight:700">عرض المواد</a></div>`;
  out+=`<div class="sec-title">المخزون</div><div class="stats">
    ${stat(S.items.length,'أصناف مواد استهلاكية','g','cons')}
    ${stat(S.assets.length,'أصناف أصول ثابتة','g','assets')}
    ${stat(S.items.reduce((a,i)=>a+i.qty,0),'إجمالي كميات المواد')}
    ${stat(S.assets.reduce((a,i)=>a+i.qty,0),'أرصدة الأصول داخل المخزن')}
    ${stat(low,'مواد منخفضة المخزون','dan','cons')}
  </div>`;
  out+=`<div class="sec-title">الطلبات</div><div class="stats">
    ${stat(cnt(r=>r.status==='new'||r.status==='review'),'طلبات نوادٍ جديدة','info','reqs')}
    ${stat(cnt(r=>r.status==='classify'),'بانتظار التصنيف','warn','reqs')}
    ${stat(cnt(r=>r.kind==='purchase'&&['new','review','classify'].includes(r.status)),'طلبات شراء واردة','info','reqs')}
    ${stat(cnt(r=>r.status==='buying'),'بانتظار الشراء','warn','reqs')}
    ${stat(cnt(r=>['bought','bought_part','received','ready'].includes(r.status)),'تم شراؤها أو توريدها','ok','reqs')}
    ${stat(cnt(r=>r.status==='rejected'),'طلبات مرفوضة','dan','reqs')}
    ${stat(cnt(r=>r.status==='closed'),'طلبات مغلقة','','reqs')}
  </div>`;
  out+=`<div class="sec-title">العهد والصرف</div><div class="stats">
    ${stat(Cu.length,'عهد خارجة','g','custody')}
    ${stat(openC,'عهد لا تزال على النوادي','warn','custody')}
    ${stat(Cu.filter(c=>c.returnReq&&c.status==='open').length,'طلبات إرجاع عهدة','info','custody')}
    ${stat(Cu.filter(c=>c.status==='returned').length,'عهد مسترجعة بالكامل','ok','custody')}
    ${stat(Cu.filter(c=>c.status==='short').length,'مسترجعة بنواقص','warn','custody')}
    ${stat(Cu.filter(c=>c.dmgPending>0).length,'عهد عالقة بتالف أو ضائع','dan','custody')}
  </div>`;
  if(can('keeper','manager','admin')){
    const ks=kitStatus(),kshort=ks.filter(x=>x.short>0);
    out+=`<div class="sec-title">التوالف وحقيبة النادي</div><div class="stats">
      ${stat(S.damages.length,'قرارات إتلاف صادرة','dan','damages')}
      ${stat(S.damages.reduce((a,d)=>a+d.qty,0),'إجمالي الأصول التالفة','dan','damages')}
      ${stat(kshort.length,'مواد ناقصة في حقيبة النادي',kshort.length?'warn':'ok','assets')}
      ${stat(Cu.filter(c=>c.kit&&c.status==='open').length,'عهد حقائب قائمة','g','custody')}
    </div>`;
  }
  out+=`<div class="sec-title">السندات</div><div class="stats">
    ${stat(V.filter(v=>v.type==='GRN').length,'سندات توريد','ok','vouchers')}
    ${stat(V.filter(v=>v.type==='CO'||v.type==='AO').length,'سندات خروج','info','vouchers')}
    ${stat(V.filter(v=>v.type==='AR').length,'سندات إرجاع','','vouchers')}
    ${stat(V.filter(v=>v.type==='NA').length,'سندات مواد غير متوفرة','dan','vouchers')}
  </div>`;
  const recent=R.slice(0,6);
  out+=`<div class="sec-title">أحدث الطلبات</div><div class="card"><div class="tw"><table>
    <thead><tr><th class="nos">الرقم</th><th class="nos">النوع</th>${ses.role!=='club'?'<th class="nos">النادي</th>':''}
    <th class="nos">التاريخ</th><th class="nos">الحالة</th><th class="nos"></th></tr></thead><tbody>
    ${recent.length?recent.map(r=>`<tr><td class="mono">${h(r.no)}</td><td>${h(kindName(r.kind))}</td>
      ${ses.role!=='club'?`<td>${h(clubName(r.clubId))}</td>`:''}
      <td>${fmtD(r.dates.created)}</td><td>${pill(r.status)}</td>
      <td><button class="btn ghost sm" onclick="openReq('${r.id}')">فتح</button></td></tr>`).join('')
      :`<tr><td colspan="6"><div class="empty"><b>لا توجد طلبات بعد</b>ابدأ بطلب مواد أو طلب شراء.</div></td></tr>`}
  </tbody></table></div></div>`;
  return out;
}

function tgl(id){
  const on=document.getElementById('ck_'+id).checked;
  const q=document.getElementById('q_'+id),n=document.getElementById('n_'+id);
  if(q){q.disabled=!on;if(on&&!q.value)q.value=1;if(!on)q.value=''}
  if(n)n.disabled=!on;
}
function collectSel(list,pfx){
  const lines=[];
  for(const it of list){
    const ck=document.getElementById('ck_'+it.id);
    if(ck&&ck.checked){
      const q=num(document.getElementById('q_'+it.id).value);
      const nt=(document.getElementById('n_'+it.id)||{}).value||'';
      if(q<=0){toast('أدخل كمية صحيحة للصنف: '+it.name,'dan');return null}
      if(q>it.qty){toast('الكمية المطلوبة من «'+it.name+'» أكبر من الرصيد المتاح ('+it.qty+')','dan');return null}
      lines.push({id:uid(),refId:it.id,name:it.name,unit:it.unit,qty:q,notes:nt,cls:pfx,status:'pending',done:0});
    }
  }
  return lines;
}
function submitConsReq(){
  const lines=collectSel(S.items.filter(i=>i.active),'consumable');
  if(lines===null)return;
  if(!lines.length)return toast('اختر مادة واحدة على الأقل','dan');
  withWindow(`سيُرسل طلب بـ ${lines.length} صنف إلى مدير المخزن.`,()=>{
    const r=newReq('consumable',lines); toast('أُرسل الطلب برقم '+r.no,'ok'); go('reqs');
  });
}
function newReq(kind,lines){
  const late=!orderOpen();
  const r={id:uid(),no:nextNo(kind==='purchase'?'PR':'MR'),kind,clubId:ses.clubId,userId:ses.id,lines,late,
    status:'review',rejectReason:'',approvedBy:null,supplier:'',
    dates:{created:nowISO(),sent:nowISO(),approved:null,rejected:null,keeper:null,bought:null,grn:null,out:null,closed:null},
    hist:[{ts:nowISO(),by:ses.fullName,txt:'أنشأ الطلب'}]};
  if(kind==='purchase'){const n=autoClassify(r);if(n)r.autoClassified=n}
  if(late)hist(r,'قُدّم الطلب خارج موعد الطلبات الأسبوعي');
  S.reqs.unshift(r);
  logIt('إنشاء طلب','طلب',r.no,'',ST[r.status]+(late?' — خارج الموعد':''));
  notify('طلب جديد '+r.no+' من '+clubName(r.clubId)+(late?' (خارج موعد الطلبات)':''),'manager');
  notify('طلب جديد '+r.no+' من '+clubName(r.clubId),'keeper');
  save();return r;
}

function normName(n){
  return String(n||'').trim().toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g,'')
    .replace(/[أإآا]/g,'ا').replace(/ى/g,'ي').replace(/[ةه]/g,'ه')
    .replace(/[ؤئء]/g,'ء').replace(/[^\u0600-\u06FF0-9a-z]+/g,' ').replace(/\s+/g,' ').trim();
}
function dupGroups(kind){
  const arr=kind==='asset'?S.assets:S.items,g={};
  arr.forEach(x=>{const k=normName(x.name);(g[k]=g[k]||[]).push(x)});
  return Object.keys(g).filter(k=>g[k].length>1).map(k=>({name:g[k][0].name,list:g[k]}));
}
function mergeModal(kind){
  const gs=dupGroups(kind),t=kind==='asset'?'الأصول الثابتة':'المواد الاستهلاكية';
  if(!gs.length)return toast('لا توجد أصناف مكررة في '+t,'ok');
  modal(`<div class="modal"><div class="mh"><h3>جمع الأصناف المكررة — ${h(t)}</h3><button onclick="closeModal()">&times;</button></div>
  <div class="mb"><div class="note">سيُدمج كل اسم مكرر في صنف واحد، وتُجمع الكميات داخل المخزن، ويُحذف المكرر مع تحويل عهده وحركاته إلى الصنف الموحّد.</div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th class="nos">الصنف</th><th class="nos">عدد السجلات</th>
      <th class="nos">الأرقام</th><th class="nos">الكميات</th><th class="nos">بعد الدمج</th></tr></thead>
      <tbody>${gs.map(g=>`<tr><td>${h(g.name)}</td><td class="mono">${g.list.length}</td>
        <td class="mono">${g.list.map(x=>h(x.code)).join(' , ')}</td>
        <td class="mono">${g.list.map(x=>x.qty).join(' + ')}</td>
        <td class="mono" style="font-weight:800">${g.list.reduce((a,x)=>a+num(x.qty),0)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="mf"><button class="btn gold" onclick="doMerge('${kind}')">تنفيذ الدمج</button>
  <button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div>`);
}
function doMerge(kind){
  const gs=dupGroups(kind);let merged=0,removed=0;
  gs.forEach(g=>{
    const keep=g.list[0],rest=g.list.slice(1);
    rest.forEach(x=>{
      keep.qty=num(keep.qty)+num(x.qty);
      if(!keep.notes&&x.notes)keep.notes=x.notes;
      if(!keep.cat&&x.cat)keep.cat=x.cat;
      if(!keep.unit&&x.unit)keep.unit=x.unit;
      if(!keep.shelf&&x.shelf)keep.shelf=x.shelf;
      if(kind==='asset'){
        S.custody.forEach(c=>{if(c.assetId===x.id){c.assetId=keep.id;c.assetCode=keep.code}});
        S.damages.forEach(d=>{if(d.assetId===x.id){d.assetId=keep.id;d.code=keep.code}});
      }
      S.reqs.forEach(r=>r.lines.forEach(l=>{if(l.refId===x.id)l.refId=keep.id}));
      (S.audits||[]).forEach(a=>a.lines.forEach(l=>{if(l.refId===x.id)l.refId=keep.id}));
      removed++;
    });
    const arr=kind==='asset'?S.assets:S.items;
    const ids=rest.map(x=>x.id);
    const idx=arr.length;
    for(let i=arr.length-1;i>=0;i--)if(ids.includes(arr[i].id))arr.splice(i,1);
    addMove('دمج أصناف مكررة',kind==='asset'?'أصل ثابت':'مادة استهلاكية',keep.name,0,keep.qty,keep.qty,
      'دمج '+rest.length+' سجل مكرر في '+keep.code);
    logIt('دمج أصناف','مخزون',keep.code,g.list.map(x=>x.code+':'+x.qty).join(' , '),keep.code+':'+keep.qty);
    merged++;
  });
  save();closeModal();renderPage();
  toast('دُمج '+merged+' صنفًا وحُذف '+removed+' سجلًا مكررًا','ok');
}

function dupCustody(clubId,assetId){
  return S.custody.filter(c=>c.clubId===clubId&&c.assetId===assetId&&c.status==='open'&&custRemain(c)>0);
}
function dupInfo(clubId,assetId){
  const d=dupCustody(clubId,assetId);
  if(!d.length)return null;
  return {qty:d.reduce((a,c)=>a+custRemain(c),0),since:d[0].issuedAt,no:d[0].no,due:d[0].dueAt,
    nos:[...new Set(d.map(c=>c.no))].join(' ، ')};
}
function outstandingFor(r){
  const seen={};
  r.lines.filter(l=>(l.cls||r.kind)==='asset'&&l.refId).forEach(l=>{
    const d=dupInfo(r.clubId,l.refId);
    if(d)seen[l.name]={name:l.name,qty:d.qty,nos:d.nos,due:d.due};
  });
  return Object.values(seen);
}

function pLineRow(name,qty,unit,cat,spec){
  const id='pl'+uid();

    <td><input class="pl-name" value="${h(name)}" onchange="syncPLine(this)" list="itemlist"></td>

function syncPLine(inp){
  const tr=inp.closest('tr'),ins=tr.querySelectorAll('input');
  const name=inp.value.trim();
  const known=[...S.items,...S.assets].find(x=>normName(x.name)===normName(name));
  if(known){ins[0].value=known.name;ins[2].value=known.unit;ins[3].value=known.cat;
    tr.classList.remove('red');toast('حُدّثت بيانات الصنف: '+known.name,'ok');}
  else{tr.classList.add('red');toast('صنف جديد غير مسجل في المخزن، تأكد من الوحدة والتصنيف','dan');}
}
function syncPEmpty(){
  const b=document.getElementById('plines'),e=document.getElementById('pempty');
  if(b&&e)e.style.display=b.children.length?'none':'block';
}
function addPLine(name,qty,unit,cat,spec){
  document.getElementById('plines').insertAdjacentHTML('beforeend',
    pLineRow(name||'',qty||1,unit||'حبة',cat||'',spec||''));
  syncPEmpty();
}
function parsePaste(){
  const txt=document.getElementById('p_paste').value.trim();
  if(!txt)return toast('الصق قائمة الاحتياجات أولًا','dan');
  let n=0;
  txt.split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line)return;
    let name=line,qty=1,unit='حبة';
    const parts=line.split(/[|\-–\t]+/).map(s=>s.trim()).filter(Boolean);
    if(parts.length>1){
      name=parts[0];
      const m=parts[1].match(/(\d+(?:\.\d+)?)\s*(.*)/);
      if(m){qty=num(m[1]);unit=(m[2]||'حبة').trim()||'حبة'}
    }else{
      const m=line.match(/^(.*?)\s+(\d+(?:\.\d+)?)\s*(\S*)$/);
      if(m){name=m[1].trim();qty=num(m[2]);unit=m[3]||'حبة'}
    }
    const known=[...S.items,...S.assets].find(x=>normName(x.name)===normName(name));
    if(known)name=known.name;
    document.getElementById('plines').insertAdjacentHTML('beforeend',
      pLineRow(name,qty,unit,known?known.cat:'',''));
    n++;
  });
  document.getElementById('p_paste').value='';syncPEmpty();
  toast('حُوّل '+n+' سطرًا إلى أصناف قابلة للتعديل','ok');
}
function submitPurchase(){
  const rows=[...document.querySelectorAll('#plines tr')];
  if(!rows.length)return toast('أضف صنفًا واحدًا على الأقل','dan');
  const lines=[];
  for(const tr of rows){
    const i=tr.querySelectorAll('input');
    const name=i[0].value.trim(),qty=num(i[1].value);
    if(!name)return toast('يوجد صنف بدون اسم','dan');
    if(qty<=0)return toast('كمية غير صحيحة للصنف: '+name,'dan');
    lines.push({id:uid(),refId:null,name,unit:i[2].value||'حبة',cat:i[3].value,qty,notes:i[4].value,
      cls:'',status:'pending',done:0});
  }
  const kind='mixed';
  const note=document.getElementById('p_note').value;
  const avail=lines.map(l=>{
    const k=normName(l.name);
    const it=S.items.find(x=>normName(x.name)===k&&x.active),as=S.assets.find(x=>normName(x.name)===k&&x.active);
    const t=it||as; if(!t||t.qty<=0)return null;
    return {line:l,kind:it?'consumable':'asset',obj:t,have:Math.min(t.qty,l.qty),short:Math.max(0,l.qty-t.qty)};
  }).filter(Boolean);
  if(avail.length)return stockOfferModal(avail,lines,kind,note);
  sendPurchase(lines,kind,note);
}
function stockOfferModal(avail,lines,kind,note){
  window.__pur={avail,lines,kind,note};
  const full=avail.filter(a=>a.short===0),part=avail.filter(a=>a.short>0);
  modal(`<div class="modal"><div class="mh"><h3>بعض الأصناف متوفرة في المخزن</h3><button onclick="closeModal()">&times;</button></div>
  <div class="mb">
    <div class="note info">توجد في المخزن أصناف من طلبك. هل ترغب بإخراجها دون شراء؟</div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th class="nos">الصنف</th><th class="nos">المطلوب</th>
      <th class="nos">المتوفر</th><th class="nos">يمكن صرفه الآن</th><th class="nos">يحتاج شراء</th></tr></thead>
      <tbody>${avail.map(a=>`<tr class="${a.short?'red':''}"><td>${h(a.line.name)}</td><td class="mono">${a.line.qty}</td>
        <td class="mono">${a.obj.qty}</td><td class="mono">${a.have}</td>
        <td class="mono ${a.short?'red-txt':''}">${a.short||'—'}</td></tr>`).join('')}</tbody></table></div>
    ${part.length?`<div class="note dan" style="margin-top:12px">مثال: طلبت ${part[0].line.qty} من «${h(part[0].line.name)}»
      والمتوفر ${part[0].obj.qty} فقط — يمكن صرف ${part[0].have} وشراء ${part[0].short}.</div>`:''}
  </div>
  <div class="mf">
    <button class="btn gold" onclick="purChoice('mixed')">صرف المتوفر وشراء الناقص</button>
    <button class="btn ghost" onclick="purChoice('issue')">صرف المتوفر فقط</button>
    <button class="btn ghost" onclick="purChoice('buy')">الشراء كاملًا</button>
    <button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div>`);
}
function purChoice(mode){
  const {avail,lines,kind,note}=window.__pur||{};
  closeModal();
  if(mode==='buy')return sendPurchase(lines,kind,note);
  const issueCons=[],issueAsset=[],buyLines=[];
  lines.forEach(l=>{
    const a=avail.find(x=>x.line===l);
    if(!a)return buyLines.push(l);
    if(a.have>0){
      const row={id:uid(),refId:a.obj.id,name:l.name,unit:a.obj.unit,qty:a.have,notes:l.notes,
        cls:a.kind,status:'pending',done:0};
      (a.kind==='asset'?issueAsset:issueCons).push(row);
    }
    if(a.short>0&&mode==='mixed')buyLines.push({...l,qty:a.short});
  });
  withWindow('سيُرسل طلب صرف بالمتوفر'+(mode==='mixed'&&buyLines.length?' وطلب شراء بالناقص':'')+'.',()=>{
    const made=[];
    if(issueCons.length){const r=newReq('consumable',issueCons);made.push(r.no)}
    if(issueAsset.length){const r=newReq('asset',issueAsset);made.push(r.no)}
    if(mode==='mixed'&&buyLines.length){
      const r=newReq('purchase',buyLines);r.kindHint=kind;r.note=note;r.status='classify';made.push(r.no);
    }
    save();toast('أُرسلت الطلبات: '+made.join(' ، '),'ok');go('reqs');
  });
}
function sendPurchase(lines,kind,note){
  withWindow(`سيُرسل طلب بـ ${lines.length} صنف إلى مدير المخزن للتصنيف والاعتماد.`,()=>{
    const r=newReq('purchase',lines); r.kindHint=kind; r.note=note; r.status='classify'; save();
    toast('أُرسل طلب الشراء برقم '+r.no,'ok'); go('reqs');
  });
}

function railFor(r){
  const steps=r.kind==='purchase'
    ?[['أُنشئ',true],['تصنيف واعتماد',['approved','keeper','buying','bought','bought_part','received','ready','issued','issued_part','closed'].includes(r.status)],
      ['شراء',['bought','bought_part','received','ready','issued','issued_part','closed'].includes(r.status)],
      ['توريد',['received','ready','issued','issued_part','closed'].includes(r.status)],
      ['صرف',['issued','issued_part','closed'].includes(r.status)],['إغلاق',r.status==='closed']]
    :[['أُنشئ',true],['اعتماد',['approved','keeper','ready','issued','issued_part','closed','await_return','returned','returned_short'].includes(r.status)],
      ['إحالة لأمين المخزن',['keeper','ready','issued','issued_part','closed','await_return','returned','returned_short'].includes(r.status)],
      ['صرف',['issued','issued_part','closed','await_return','returned','returned_short'].includes(r.status)],
      ['إغلاق',['closed','returned','returned_short'].includes(r.status)]];
  let firstOpen=steps.findIndex(s=>!s[1]);
  return `<div class="rail">${steps.map((s,i)=>{
    const cls=s[1]?'done':(i===firstOpen?'now':'');
    return `<div class="${cls}"><i>${s[1]?'✓':i+1}</i>${s[0]}</div>`}).join('')}</div>`;
}
function reqActions(r){
  const a=[];
  if(r.status==='rejected'||r.status==='closed')return a;
  /* التصنيف والاعتماد والشراء والتوريد: مدير المخزن أو أمين المخزن أو مشرف النوادي */
  if(can('manager','keeper')&&['review','classify','new'].includes(r.status)){
    a.push({t:'اعتماد',fn:`approveReq('${r.id}')`,cls:'ok'});
    a.push({t:'رفض',fn:`rejectReq('${r.id}')`,cls:'dan'});
  }
  if(r.kind==='purchase'){
    if(can('manager','supervisor')&&['keeper','buying'].includes(r.status))
      a.push({t:'اعتماد وحفظ الشراء',fn:`buyModal('${r.id}')`,cls:'gold'});
    if(can('manager','keeper')&&['bought','bought_part'].includes(r.status))
      a.push({t:'تسجيل التوريد',fn:`grnModal('${r.id}')`,cls:'gold'});
  }
  /* الصرف: مدير المخزن فقط */
  if(can('manager')){
    if(r.kind==='purchase'&&['received','ready','issued_part'].includes(r.status))
      a.push({t:'صرف للنادي',fn:`issueModal('${r.id}')`,cls:'gold'});
    if(r.kind!=='purchase'&&['keeper','approved','ready','issued_part'].includes(r.status))
      a.push({t:'صرف للنادي',fn:`issueModal('${r.id}')`,cls:'gold'});
  }
  if(can('manager','keeper')&&['issued','not_bought','returned','returned_short'].includes(r.status))
    a.push({t:'إغلاق الطلب',fn:`closeReq('${r.id}')`,cls:'ghost'});
  return a;
}

  const lines=r.lines.map(l=>`<tr><td>${h(l.name)}</td><td class="mono">${l.qty}</td><td>${h(l.unit)}</td>

function lineStatus(l){
  const m={pending:['p-gray','بانتظار'],bought:['p-ok','تم الشراء'],partial:['p-warn','شراء جزئي'],
    in_stock:['p-ok','متوفر بالمخزن — يُصرف دون شراء'],
    not_bought:['p-dan','لم يتم الشراء'],unavailable:['p-dan','غير متوفر'],cancelled:['p-gray','ملغي'],
    issued:['p-ok','تم الصرف'],issued_part:['p-warn','صرف جزئي']};
  const x=m[l.status]||m.pending;
  return `<span class="pill ${x[0]}">${x[1]}</span>`;
}
function clsCats(){
  const base=['رياضية','ضيافة ورحلات','مواد استهلاكية'];
  return [...new Set([...base,...S.cats.c,...S.cats.a])];
}
function setCat(rid,lid,v){
  const r=S.reqs.find(x=>x.id===rid),l=r.lines.find(x=>x.id===lid);
  l.cat=v;rememberCls(l.name,null,v);save();logIt('تصنيف صنف','طلب',r.no,'',l.name+' → '+v);
}
function rememberCls(name,cls,cat){
  S.clsMap=S.clsMap||{};
  const k=String(name||'').trim(); if(!k)return;
  S.clsMap[k]=Object.assign({},S.clsMap[k],cls?{cls}:{},cat?{cat}:{});
}
function knownCls(name){
  const k=normName(name);
  const map=S.clsMap||{};
  let m=map[String(name||'').trim()]||Object.keys(map).map(x=>normName(x)===k?map[x]:null).find(Boolean);
  if(m&&m.cls)return m;
  const it=S.items.find(x=>normName(x.name)===k); if(it)return {cls:'consumable',cat:it.cat};
  const a=S.assets.find(x=>normName(x.name)===k); if(a)return {cls:'asset',cat:a.cat};
  return m||null;
}
function autoClassify(r){
  let n=0;
  r.lines.forEach(l=>{
    if(l.cls)return;
    const k=knownCls(l.name);
    if(k&&k.cls){l.cls=k.cls;if(k.cat)l.cat=k.cat;l.autoCls=true;n++}
  });
  if(n)hist(r,'صنّف النظام '+n+' صنفًا تلقائيًا حسب تصنيف سابق معتمد');
  return n;
}
function setCls(rid,lid,v){
  const r=S.reqs.find(x=>x.id===rid),l=r.lines.find(x=>x.id===lid);
  l.cls=v;rememberCls(l.name,v,l.cat);save();logIt('تصنيف صنف','طلب',r.no,'',l.name+' → '+(v==='asset'?'أصل ثابت':'مادة استهلاكية'));
}
function hist(r,txt){r.hist.push({ts:nowISO(),by:ses.fullName,txt})}
function approveReq(id){
  if(!can('manager','keeper'))return toast('هذا الإجراء من صلاحية مدير المخزن أو أمين المخزن أو مشرف النوادي','dan');
  const r=S.reqs.find(x=>x.id===id);
  if(r.kind==='purchase'&&r.lines.some(l=>!l.cls))
    return toast('صنّف جميع الأصناف إلى مادة استهلاكية أو أصل ثابت قبل الاعتماد','dan');
  confirmBox('اعتماد الطلب','سيُحال الطلب '+r.no+' إلى أمين المخزن للتنفيذ.',()=>{
    applyApprove(r);save();renderPage();toast('اعتُمد الطلب','ok');
  },'ok');
}
function stockMatch(l){
  const k=normName(l.name);
  const it=S.items.find(x=>normName(x.name)===k&&x.active),as=S.assets.find(x=>normName(x.name)===k&&x.active);
  const t=(l.cls==='asset')?(as||it):(it||as);
  if(!t||t.qty<=0)return null;
  return {obj:t,kind:(t===as?'asset':'consumable'),have:Math.min(t.qty,l.qty-(l.done||0))};
}
function applyApprove(r){
  let fromStock=[];
  if(r.kind==='purchase'){
    r.lines.forEach(l=>{
      const m=stockMatch(l);
      if(m&&m.have>0){
        l.refId=m.obj.id;l.cls=l.cls||m.kind;l.fromStock=true;l.status='in_stock';
        l.grn=m.have;l.bought=0;
        fromStock.push({name:l.name,qty:m.have,short:l.qty-m.have});
      }
    });
    r.fromStock=fromStock;
  }
  r.status=r.kind==='purchase'?(fromStock.length&&r.lines.every(l=>l.fromStock&&l.grn>=l.qty)?'ready':'buying'):'keeper';
  r.dates.approved=nowISO();r.dates.keeper=nowISO();r.approvedBy=ses.fullName;
  hist(r,'اعتمد الطلب وأحاله إلى أمين المخزن');
  logIt('اعتماد طلب','طلب',r.no,'',ST[r.status]);
  notify('طلب '+r.no+' معتمد ومحال إليك','keeper');
  notify('اعتُمد طلبكم '+r.no,'club',r.clubId);
  const dupsNow=r.lines.filter(l=>(l.cls||r.kind)==='asset'&&l.refId&&dupInfo(r.clubId,l.refId));
  if(dupsNow.length){
    const det=outstandingFor(r).map(x=>x.name+' ('+x.qty+' بسند '+x.nos+')').join(' · ');
    const txt='تنبيه: طلب '+r.no+' يشمل أصولًا لا تزال في عهدة '+clubName(r.clubId)+' — '+det+
      ' — لا يُصرف قبل إرجاعها أو بقرار من الإدارة.';
    hist(r,txt);notify(txt,'keeper');notify(txt,'manager');notify(txt,'admin');
    toast(txt,'dan');
  }
  if(fromStock.length){
    const txt='أصناف متوفرة في المخزن ولا تحتاج شراء، ستُصرف من المخزون: '+
      fromStock.map(x=>x.name+' ('+x.qty+')'+(x.short>0?' — يحتاج شراء '+x.short:'')).join(' · ');
    hist(r,txt);
    notify('طلب '+r.no+': '+txt,'club',r.clubId);
    notify('طلب '+r.no+': '+txt,'keeper');
    toast(txt,'ok');
  }
}

function bulkApprove(){
  if(!can('manager','keeper'))return toast('صلاحية غير كافية','dan');

  if(unclassified.length)return toast('صنّف أصناف الطلبات أولًا: '+unclassified.map(r=>r.no).join(' ، '),'dan');
  confirmBox('اعتماد جماعي','سيُعتمد '+ok.length+' طلب ويُحال إلى أمين المخزن.',()=>{
    ok.forEach(applyApprove);save();renderPage();toast('اعتُمد '+ok.length+' طلب','ok');

function syncBuy(lid,qty){
  const st=document.getElementById('bs_'+lid).value,q=document.getElementById('bq_'+lid);
  if(st==='bought')q.value=qty; else if(st==='partial')q.value=Math.max(1,Math.floor(qty/2));
  else q.value=0;
}
function saveBuy(id){
  if(!can('manager','supervisor'))return toast('اعتماد الشراء وحفظه من صلاحية مشرف النوادي أو مدير المخزن','dan');
  const r=S.reqs.find(x=>x.id===id);
  const sup=document.getElementById('b_sup').value.trim();
  const dt=document.getElementById('b_date').value;
  const na=[];
  for(const l of r.lines){
    if(!document.getElementById('bs_'+l.id))continue;
    const st=document.getElementById('bs_'+l.id).value;
    const q=num(document.getElementById('bq_'+l.id).value);
    const price=num(document.getElementById('bp_'+l.id).value);
    const nt=document.getElementById('bn_'+l.id).value.trim();
    if(st==='bought'&&q<=0)return toast('أدخل كمية مشتراة للصنف: '+l.name,'dan');
    if(st==='partial'&&(q<=0||q>=l.qty))return toast('الشراء الجزئي يتطلب كمية بين 1 و '+(l.qty-1)+' للصنف: '+l.name,'dan');
    if(['not_bought','unavailable'].includes(st)&&!nt)return toast('اكتب سبب عدم التوفير للصنف: '+l.name,'dan');
    l.status=st;l.bought=['not_bought','unavailable','cancelled'].includes(st)?0:q;l.price=price;l.buyNote=nt;
    if(l.bought<l.qty)na.push({name:l.name,unit:l.unit,qty:l.qty,qty2:l.qty-l.bought,notes:nt||'—'});
  }
  r.supplier=sup;r.dates.bought=dt?new Date(dt).toISOString():nowISO();
  const anyBought=r.lines.some(l=>l.bought>0);
  const allBought=r.lines.every(l=>l.bought>=l.qty);
  r.status=allBought?'bought':anyBought?'bought_part':'not_bought';

  if(na.length){

    notify('صدر سند مواد غير متوفرة '+v.no+' للطلب '+r.no,'club',r.clubId);

function findOrCreateItem(l){
  let it=l.refId?itemById(l.refId):null;
  if(!it)it=S.items.find(i=>normName(i.name)===normName(l.name));
  if(!it){
    it={id:uid(),code:'C-'+String(S.items.length+1).padStart(4,'0'),name:l.name,cat:l.cat||S.cats.c[0],
      unit:l.unit,qty:0,min:3,notes:'أُنشئ من طلب شراء',active:true};
    S.items.push(it);logIt('إضافة صنف','مادة استهلاكية',it.code,'',it.name);
  }
  return it;
}
function findOrCreateAsset(l){
  let a=l.refId?assetById(l.refId):null;
  if(!a)a=S.assets.find(x=>normName(x.name)===normName(l.name));
  if(!a){
    a={id:uid(),code:'FA-'+String(S.assets.length+1).padStart(4,'0'),name:l.name,cat:l.cat||S.cats.a[0],desc:'',
      unit:l.unit,qty:0,cond:'جيدة',shelf:'—',barcode:'629'+Math.floor(Math.random()*900000000+100000000),
      pdate:today(),value:l.price||0,notes:'أُنشئ من طلب شراء',active:true};
    S.assets.push(a);logIt('إضافة أصل','أصل ثابت',a.code,'',a.name);
  }
  return a;
}
function saveGrn(id){
  if(!can('manager','keeper'))return toast('هذا الإجراء من صلاحية مدير المخزن أو أمين المخزن أو مشرف النوادي','dan');
  const r=S.reqs.find(x=>x.id===id);
  const dt=document.getElementById('g_date').value,by=document.getElementById('g_by').value;
  const vl=[];
  for(const l of r.lines){
    const inp=document.getElementById('g_'+l.id); if(!inp)continue;
    const q=num(inp.value); if(q<=0)continue;
    if(q>l.bought-(l.grn||0))return toast('الكمية الموردة أكبر من المشتراة للصنف: '+l.name,'dan');
    const tgt=l.cls==='asset'?findOrCreateAsset(l):findOrCreateItem(l);
    const before=tgt.qty;tgt.qty+=q;l.grn=(l.grn||0)+q;l.refId=tgt.id;
    addMove('توريد',l.cls==='asset'?'أصل ثابت':'مادة استهلاكية',tgt.name,q,before,tgt.qty,'',r.no,r.clubId);
    vl.push({name:l.name,unit:l.unit,qty:l.qty,qty2:q,qty3:l.qty-q,code:tgt.code,notes:(document.getElementById('gn_'+l.id)||{}).value||''});
  }
  if(!vl.length)return toast('أدخل كمية موردة واحدة على الأقل','dan');
  r.dates.grn=dt?new Date(dt).toISOString():nowISO();
  r.status='ready';hist(r,'سجّل التوريد إلى المخزن');
  const v=mkVoucher('GRN',r,vl,{supplier:r.supplier,receiver:by,notes:''});
  logIt('توريد','سند',v.no,'','تم');
  notify('تم توريد مواد الطلب '+r.no+' وجاهزة للصرف','club',r.clubId);
  notify('سند توريد '+v.no+' للطلب '+r.no,'manager');
  save();closeModal();renderPage();toast('حُفظ التوريد وحُدّثت الأرصدة','ok');
}
function issueLines(r){
  return r.lines.filter(l=>{
    const cls=l.cls||(r.kind==='asset'?'asset':'consumable');
    const rem=l.qty-(l.done||0);
    if(rem<=0)return false;
    if(r.kind==='purchase'&&!(l.grn>0))return false;
    return true;
  });
}

      <b>العهد القائمة لدى ${h(clubName(r.clubId))}:</b>

function addDays(n){const d=new Date();d.setDate(d.getDate()+num(n||14));return d.toISOString().slice(0,10)}
function saveIssue(id){
  if(!can('manager'))return toast('الصرف من صلاحية مدير المخزن فقط','dan');
  const r=S.reqs.find(x=>x.id===id);
  const dt=document.getElementById('s_date').value,by=document.getElementById('s_by').value,
        to=document.getElementById('s_to').value,due=document.getElementById('s_due').value;
  const cons=[],asst=[],pend=[];
  for(const l of r.lines){
    const inp=document.getElementById('s_'+l.id); if(!inp)continue;
    const q=num(inp.value); if(q<=0)continue;
    const cls=l.cls||(r.kind==='asset'?'asset':'consumable');
    const tgt=cls==='asset'?(assetById(l.refId)||S.assets.find(a=>a.name===l.name)):(itemById(l.refId)||S.items.find(i=>i.name===l.name));
    if(!tgt)return toast('الصنف غير مسجل في المخزن: '+l.name,'dan');
    if(q>tgt.qty)return toast('الكمية المصروفة من «'+l.name+'» تتجاوز الرصيد الفعلي ('+tgt.qty+')','dan');
    if(q>l.qty-(l.done||0))return toast('الكمية أكبر من المتبقي في الطلب للصنف: '+l.name,'dan');
    pend.push({l,q,cls,tgt,note:(document.getElementById('sn_'+l.id)||{}).value||''});
  }
  if(!pend.length)return toast('أدخل كمية صرف واحدة على الأقل','dan');
  const dupEl=document.getElementById('s_dup');
  const dupLines=pend.filter(p=>p.cls==='asset'&&dupInfo(r.clubId,p.tgt.id));
  if(dupLines.length){
    const rs=dupEl?dupEl.value.trim():'';
    if(!rs)return toast('اكتب سبب خروج العهدة رغم وجود عهدة قائمة لدى النادي','dan');
    r.dupIssueReason=rs;
    r.dupNos=[...new Set(dupLines.map(p=>(dupInfo(r.clubId,p.tgt.id)||{}).nos).filter(Boolean))].join(' ، ');
    hist(r,'صرف عهدة رغم وجود عهدة قائمة بسند '+r.dupNos+' — السبب: '+rs);
    logIt('صرف عهدة مكررة','طلب',r.no,'',dupLines.map(p=>p.tgt.name).join(' , '),rs);
  }
  const dISO=dt?new Date(dt).toISOString():nowISO();
  for(const p of pend){
    const before=p.tgt.qty;p.tgt.qty-=p.q;p.l.done=(p.l.done||0)+p.q;p.l.refId=p.tgt.id;
    p.l.status=p.l.done>=p.l.qty?'issued':'issued_part';
    addMove('صرف',p.cls==='asset'?'أصل ثابت':'مادة استهلاكية',p.tgt.name,-p.q,before,p.tgt.qty,'',r.no,r.clubId);
    const row={name:p.l.name,code:p.tgt.code,unit:p.l.unit,qty:p.q,notes:p.note,cond:p.tgt.cond||''};
    (p.cls==='asset'?asst:cons).push(row);
  }
  if(cons.length){
    const v=mkVoucher('CO',r,cons,{deliverer:by,receiver:to,date:dISO,notes:''});
    logIt('صرف مواد استهلاكية','سند',v.no,'','تم');
  }
  if(asst.length){
    const v=mkVoucher('AO',r,asst,{deliverer:by,receiver:to,date:dISO,dueAt:due,notes:''});
    asst.forEach(row=>{
      const a=S.assets.find(x=>x.code===row.code);
      S.custody.push({id:uid(),no:v.no,voucherId:v.id,reqId:r.id,assetId:a.id,assetCode:a.code,assetName:a.name,
        clubId:r.clubId,qty:row.qty,retQty:0,dmgPending:0,dmgDone:0,issuedAt:dISO,dueAt:due,status:'open',returnReq:false,
        cond:a.cond,notes:row.notes,retDate:null,retVoucher:null,dmgVoucher:null,
        kit:!!r.kit,kitName:r.kit?(r.kitName||kitDef().name):''});
    });
    logIt('صرف عهدة','سند',v.no,'','تم');
  }
  r.dates.out=dISO;
  const allDone=r.lines.every(l=>(l.done||0)>=l.qty||['not_bought','unavailable','cancelled'].includes(l.status));
  const openC=S.custody.some(x=>x.reqId===r.id&&x.status==='open');
  hist(r,'صرف مواد الطلب');
  if(!allDone){ r.status='issued_part'; }
  else if(openC){ r.status='await_return'; hist(r,'الأصول الثابتة مسجّلة عهدة على النادي حتى إصدار سند الإرجاع'); }
  else { r.status='closed';r.dates.closed=nowISO();hist(r,'أُغلق الطلب تلقائيًا بعد صرف المواد الاستهلاكية'); }
  notify('صُرفت مواد الطلب '+r.no,'club',r.clubId);
  runAlerts();
  save();closeModal();renderPage();toast('تم الصرف وحُدّثت الأرصدة','ok');
}

const VPFX={GRN:'GRN',CO:'CO',AO:'AO',AR:'AR',NA:'NA',DM:'DM'};
function vTypeName(t){return {GRN:'سند توريد للمخزن',CO:'سند خروج مواد استهلاكية',AO:'سند خروج عهدة',

function mkVoucher(type,r,lines,o){
  o=o||{};
  const v={id:uid(),no:nextNo(VPFX[type]),type,reqId:r?r.id:null,reqNo:r?r.no:'',clubId:r?r.clubId:o.clubId,
    date:o.date||nowISO(),lines,supplier:o.supplier||'',deliverer:o.deliverer||ses.fullName,keeper:o.keeper||'',
    receiver:o.receiver||'',dueAt:o.dueAt||'',notes:o.notes||'',by:ses.fullName,cancelled:false,cancelReason:''};
  S.vouchers.unshift(v);save();return v;
}
function pgVouchers(){

const PTB=`<div class="ptb">
  <button class="b-print" onclick="window.print()">&#128424; طباعة</button>
  <button class="b-pdf" onclick="window.print()">&#11015; تنزيل PDF</button>
  <button class="b-close" onclick="window.close()">&times; إغلاق</button></div>`;
const PTBCSS=`
.ptb{display:flex;gap:8px;justify-content:flex-end;padding:10px 24px;background:#F5F7FA;border-bottom:1px solid #dfe6ec;position:sticky;top:0}
.ptb button{cursor:pointer;border:none;border-radius:7px;padding:9px 17px;font-family:'Tajawal',Arial;font-size:12.5px;font-weight:700}
.ptb .b-print{background:#0B3B6B;color:#fff}.ptb .b-pdf{background:#1B5FA6;color:#fff}.ptb .b-close{background:#e2e8ee;color:#16212B}
@media print{.ptb{display:none!important}}
@page{size:A4 landscape;margin:12mm}
body{margin:0;background:#fff}
.wrap{padding:16px 24px}
`;
function docHead(title,sub,no,flag){
  return `<div class="hdr">
    <div style="display:flex;gap:10px;align-items:center">
      ${S.settings.logo?`<img src="${S.settings.logo}" style="width:46px;height:46px;border-radius:10px;object-fit:cover">`
        :`<div class="logo">${h((S.settings.orgName||'م')[0])}</div>`}
      <div><div class="org">${h(S.settings.orgName)}</div>
      <div class="org-sub">CULTURAL CLUBS WAREHOUSE MANAGEMENT SYSTEM</div>
      <div style="font-size:10px;color:#5B6A78">${h(S.settings.warehouse)}</div></div>
    </div>
    <div class="date">تاريخ الطباعة<br><strong>${fmtD(nowISO())}</strong><br>${h(ses?ses.fullName:'')}</div></div>
  <div class="title">${h(title)}</div><div class="title-sub">${h(sub)}</div>
  ${flag?`<div class="flag"><span>${h(flag)}</span></div>`:''}
  ${no?`<div class="num">${h(no)}</div>`:''}`;
}
function metaRow(cells){
  return `<div class="meta">${cells.map(c=>`<div class="cell"><div class="lbl">${h(c[0])}</div>
    <div class="val ${c[2]?'acc':''}">${h(c[1]||'—')}</div></div>`).join('')}</div>`;
}
function voucherDoc(v){
  const EN={GRN:'GOODS RECEIPT NOTE',CO:'CONSUMABLE ISSUE VOUCHER',AO:'FIXED ASSET ISSUE VOUCHER',
    AR:'FIXED ASSET RETURN VOUCHER',NA:'UNAVAILABLE ITEMS NOTE',DM:'ASSET DAMAGE / LOSS VOUCHER'}[v.type]||'';
  let cols='',rows='',foot='',meta=[],ack='',flag='';
  const tot=v.lines.reduce((a,l)=>a+num(l.qty),0);
  if(v.type==='GRN'){
    meta=[['رقم الطلب',v.reqNo],['المورد',v.supplier],['تاريخ التوريد',fmtD(v.date),1],['النادي المستفيد',clubName(v.clubId)]];
    cols='<tr><th>م</th><th>الصنف</th><th>الوحدة</th><th>الكمية المطلوبة</th><th>الكمية الموردة</th><th>غير الموردة</th><th>ملاحظات</th></tr>';
    rows=v.lines.map((l,i)=>`<tr><td>${i+1}</td><td style="text-align:right;font-weight:700">${h(l.name)}</td><td>${h(l.unit)}</td>
      <td>${l.qty}</td><td><strong>${l.qty2}</strong></td><td>${l.qty3||0}</td><td>${h(l.notes||'—')}</td></tr>`).join('');
    foot=`<tfoot><tr><td colspan="4">إجمالي الكميات الموردة</td><td colspan="3">${v.lines.reduce((a,l)=>a+num(l.qty2),0)}</td></tr></tfoot>`;
    ack='أقر أنا مستلم المواد باستلام الأصناف المذكورة أعلاه وإدخالها إلى المخزن، وأن البيانات المدونة <strong>صحيحة ومطابقة</strong> للواقع.';
  }else if(v.type==='CO'){
    flag='مواد استهلاكية — لا تُسجّل عهدة ولا تُرجع';
    meta=[['رقم الطلب',v.reqNo],['النادي',clubName(v.clubId)],['تاريخ الخروج',fmtD(v.date),1],['عدد الأصناف',v.lines.length]];
    cols='<tr><th>م</th><th>رقم الصنف</th><th>المادة</th><th>الوحدة</th><th>الكمية المصروفة</th><th>ملاحظات</th></tr>';
    rows=v.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${h(l.code||'—')}</td><td style="text-align:right;font-weight:700">${h(l.name)}</td>
      <td>${h(l.unit)}</td><td><strong>${l.qty}</strong></td><td>${h(l.notes||'—')}</td></tr>`).join('');
    foot=`<tfoot><tr><td colspan="4">إجمالي الكميات</td><td colspan="2">${tot}</td></tr></tfoot>`;
    ack='أقر أنا مستلم المواد باستلام الأصناف الاستهلاكية المذكورة أعلاه كاملة وبحالة سليمة، وهي <strong>مواد مستهلكة غير مرتجعة</strong>.';
  }else if(v.type==='AO'){
    flag='عهدة على النادي — واجبة الإرجاع';
    meta=[['رقم الطلب',v.reqNo],['النادي',clubName(v.clubId)],['تاريخ الخروج',fmtD(v.date)],['الموعد المتوقع للإرجاع',fmtD(v.dueAt),1]];
    cols='<tr><th>م</th><th>رقم الأصل</th><th>الأصل</th><th>الكمية</th><th>حالة الأصل عند التسليم</th><th>ملاحظات</th></tr>';
    rows=v.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${h(l.code||'—')}</td><td style="text-align:right;font-weight:700">${h(l.name)}</td>
      <td><strong>${l.qty}</strong></td><td>${h(l.cond||'—')}</td><td>${h(l.notes||'—')}</td></tr>`).join('');
    foot=`<tfoot><tr><td colspan="3">إجمالي الكميات</td><td colspan="3">${tot}</td></tr></tfoot>`;
    ack='أقر أنا مستلم العهدة باستلام الأصول المذكورة أعلاه، وألتزم بالمحافظة عليها وإعادتها في الموعد المحدد، وأتحمل <strong>قيمة أي نقص أو تلف</strong> يقع عليها.';
  }else if(v.type==='AR'){
    const c=S.custody.find(x=>x.retVoucher===v.id);
    meta=[['سند الخروج الأصلي',c?c.no:''],['النادي',clubName(v.clubId)],
      ['تاريخ الإرجاع',fmtD(v.date),1],['مستلم العهدة',v.receiver]];
    cols='<tr><th>م</th><th>رقم الأصل</th><th>الأصل</th><th>الكمية المصروفة</th><th>الكمية المرتجعة</th><th>الكمية الناقصة</th><th>حالة الأصل عند الإرجاع</th><th>ملاحظات النقص أو التلف</th></tr>';
    rows=v.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${h(l.code||'—')}</td><td style="text-align:right;font-weight:700">${h(l.name)}</td>
      <td>${l.qty}</td><td><strong>${l.qty2}</strong></td><td style="color:#8A1538;font-weight:700">${l.qty3}</td>
      <td>${h(l.cond||'—')}</td><td>${h(l.notes||'—')}</td></tr>`).join('');
    const short=v.lines.reduce((a,l)=>a+num(l.qty3),0);
    flag=short?'مسترجعة بنواقص':'مسترجعة بالكامل';
    ack=short?'استُلمت العهدة <strong>بنواقص</strong> حسب البيان أعلاه، ويبقى النقص مسجلًا على النادي حتى تسويته.'
      :'استُلمت العهدة <strong>كاملة</strong> وأُخليت مسؤولية النادي عنها اعتبارًا من تاريخ هذا السند.';
  }else if(v.type==='DM'){
    flag='تالف أو ضائع — قرار معتمد';
    meta=[['رقم الطلب',v.reqNo],['النادي',clubName(v.clubId)],['تاريخ القرار',fmtD(v.date),1],['المعتمد',v.receiver||v.by]];
    cols='<tr><th>م</th><th>رقم الأصل</th><th>الأصل</th><th>الكمية المصروفة</th><th>الكمية التالفة/الضائعة</th><th>المتبقي على النادي</th><th>سبب التلف أو الفقد</th></tr>';
    rows=v.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${h(l.code||'—')}</td><td style="text-align:right;font-weight:700">${h(l.name)}</td>
      <td>${l.qty}</td><td style="color:#8A1538;font-weight:800">${l.qty2}</td><td>${l.qty3}</td><td>${h(l.notes||'—')}</td></tr>`).join('');
    ack='بموجب هذا السند اعتُمد قرار التصرف في الأصول التالفة أو الضائعة أعلاه، <strong>'+h(v.notes.replace('القرار: ','').split(' — ')[0])+'</strong>، ويُرفع القيد عن النادي بعد تنفيذ القرار.';
  }else{
    flag='أصناف لم يتم توفيرها';
    meta=[['رقم الطلب',v.reqNo],['النادي',clubName(v.clubId)],['تاريخ السند',fmtD(v.date),1],['الموظف المسؤول',v.by]];
    cols='<tr><th>م</th><th>الصنف</th><th>الوحدة</th><th>الكمية المطلوبة</th><th>الكمية غير المتوفرة</th><th>سبب عدم التوفير</th></tr>';
    rows=v.lines.map((l,i)=>`<tr><td>${i+1}</td><td style="text-align:right;font-weight:700">${h(l.name)}</td><td>${h(l.unit)}</td>
      <td>${l.qty}</td><td style="color:#8A1538;font-weight:700">${l.qty2}</td><td>${h(l.notes||'—')}</td></tr>`).join('');
    ack='هذا السند بيان بالأصناف التي <strong>تعذّر توفيرها</strong> ضمن الطلب أعلاه، ويُرفق بملف الطلب عند إغلاقه.';
  }
  const s1=v.type==='GRN'?['مستلم المواد',v.deliverer]
    :v.type==='AR'?['مستلم العهدة',v.receiver]
    :v.type==='DM'?['معتمد القرار',v.receiver||v.by]:['مسلّم المواد',v.deliverer];
  const s2=v.type==='GRN'?['مدخل البيانات',v.by]
    :v.type==='AR'?['أمين المخزن',v.keeper||v.by]
    :v.type==='DM'?['أمين المخزن',v.keeper||v.by]:['مستلم المواد',v.receiver||v.by];
  const rq=v.reqId?S.reqs.find(x=>x.id===v.reqId):null;
  const outWarn=(v.type==='AO'&&rq&&(rq.dup||rq.dupIssueReason))
    ?`<div class="ack" style="border-color:#E9BEB8;background:#FBEFED"><strong>تنبيه لمشرف النادي:</strong>
       صُرفت هذه العهدة مع وجود عهدة سابقة بنفس المسمى لم تُرجَع${rq.dupNos?' (سند رقم '+h(rq.dupNos)+')':''}.
       ${rq.dupIssueReason?'قرار الإدارة: '+h(rq.dupIssueReason)+'.':''} يجب إرجاع العهدة السابقة.</div>`:'';
  const kitWarn=(v.type==='AO'&&rq&&rq.kit&&rq.kitShort&&rq.kitShort.length)
    ?`<div class="ack" style="border-color:#E9BEB8;background:#FBEFED"><strong>تنبيه: ${h(rq.kitName||'الحقيبة')} مصروفة ناقصة.</strong>
       النواقص: ${rq.kitShort.map(x=>h(x.name)+' ('+x.qty+')').join(' · ')} — لم تتوفر في المخزن وقت الصرف.</div>`:'';
  return `<div class="pv">
    ${docHead(vTypeName(v.type),EN,v.no,flag)}
    ${metaRow(meta)}
    ${kitWarn}${outWarn}
    <div class="sec">بيان الأصناف</div>
    <table><thead>${cols}</thead><tbody>${rows}</tbody>${foot}</table>
    ${v.notes?`<div style="margin-top:10px;font-size:11.5px">ملاحظات: ${h(v.notes)}</div>`:''}
    <div class="ack">${ack}</div>
    ${v.cancelled?`<div class="cancel">سند ملغي — ${h(v.cancelReason)}</div>`:''}
    <div class="sign"><div>${h(s1[0])}<br><strong>${h(s1[1]||'')}</strong></div>
      <div>${h(s2[0])}<br><strong>${h(s2[1]||'')}</strong></div>
      <div>اعتماد مدير المخزن<br>&nbsp;</div></div>
    <div class="ftr"><span>${h(S.settings.orgName)} — ${h(S.settings.warehouse)}</span>
      <span>${h(v.no)} · طُبع في ${fmtDT(nowISO())}</span></div></div>`;
}

  <div class="mf"><button class="btn gold" onclick="printPage(voucherDoc(S.vouchers.find(x=>x.id==='${id}')),'${h(v.no)}')">&#128424; طباعة / تنزيل PDF</button>
  <button class="btn ghost" onclick="exportVoucherXls('${id}')">&#128202; تنزيل Excel</button>
  <button class="btn ghost" onclick="closeModal()">&times; إغلاق</button></div></div>`);
}
function cancelVoucher(id){
  const v=S.vouchers.find(x=>x.id===id);
  modal(`<div class="modal sm"><div class="mh"><h3>إلغاء السند ${h(v.no)}</h3><button onclick="closeModal()">&times;</button></div>
  <div class="mb"><div class="note dan">لا يُحذف أي سند نهائيًا. يُسجَّل الإلغاء مع السبب ويبقى السند في السجل.</div>
  <div class="field" style="margin-top:12px"><label>سبب الإلغاء</label><textarea id="cv"></textarea></div></div>
  <div class="mf"><button class="btn dan" onclick="doCancelV('${id}')">تأكيد الإلغاء</button>
  <button class="btn ghost" onclick="closeModal()">تراجع</button></div></div>`);
}
function doCancelV(id){
  const v=S.vouchers.find(x=>x.id===id);
  const rs=document.getElementById('cv').value.trim();
  if(!rs)return toast('سبب الإلغاء إلزامي','dan');
  v.cancelled=true;v.cancelReason=rs;
  logIt('إلغاء سند','سند',v.no,'ساري','ملغي',rs);
  addMove('إلغاء سند',vTypeName(v.type),v.no,0,0,0,rs,v.no,v.clubId);
  save();closeModal();renderPage();toast('سُجّل إلغاء السند','ok');
}
function printPage(html,title){
  const w=window.open('','_blank');
  if(!w){toast('اسمح بالنوافذ المنبثقة ليعمل أمر الطباعة','dan');return}
  w.document.write(`<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${h(title||'طباعة')}</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>${PTBCSS}${PCSS}</style></head><body>${PTB}<div class="wrap">${html}</div></body></html>`);
  w.document.close();
}
function printDoc(html){printPage(html,'طباعة')}

    ${metaRow([['النادي',clubName(r.clubId)],['مقدم الطلب',userName(r.userId)],

    <tbody>${rows}</tbody></table>
    ${r.rejectReason?`<div class="ack">سبب الرفض: <strong>${h(r.rejectReason)}</strong></div>`:''}
    <div class="sign"><div>مقدم الطلب<br><strong>${h(userName(r.userId))}</strong></div>
      <div>مدير المخزن<br><strong>${h(r.approvedBy||'')}</strong></div>
      <div>أمين المخزن<br>&nbsp;</div></div>
    <div class="ftr"><span>${h(S.settings.orgName)}</span><span>${h(r.no)} · ${fmtDT(nowISO())}</span></div></div>`,'طلب '+r.no);
